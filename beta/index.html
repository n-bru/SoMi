<style>

.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.pad.st{grid-template-columns:repeat(4,1fr)}.pad.st .nt{opacity:.7;font-weight:600}.pad.st button{min-height:58px;display:grid;grid-template-rows:auto auto auto;align-content:start;justify-items:center;align-items:center;gap:2px;padding:6px 2px}.pad.st b{font-size:1.5rem;line-height:1}.pad.st.av{grid-template-columns:repeat(3,1fr)}.pad button.cur{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.pad button.cur span{color:var(--acc-ink)}.seqrow{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}.asvrow>div+div{margin-top:8px}.seqrow .seqk{margin:0 0 6px}.btn.stb.cur{background:var(--news);border:2px solid var(--sig);color:var(--sig-ink)}.pad.st span{font-size:.75rem;font-weight:600;color:var(--muted);line-height:1.2;text-align:center}
.bar{height:6px;border-radius:3px;background:var(--soft);margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.seqsus{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 8px}.seqsus .code{font-size:2rem}.kic.big{width:60px;height:60px;font-size:2rem}
.btn.abw{border-style:dashed}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.three .btn{padding-left:4px;padding-right:4px}
.spg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}.spg div{background:var(--soft,rgba(0,0,0,.04));border-radius:10px;padding:6px 0}.spg b{display:block;font-size:1.2rem}
.kp{font-size:1.8rem!important;text-align:center;font-weight:800;max-width:220px;margin:0 auto;display:block}
.nm{display:block;font-size:.8rem;font-weight:600;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}h1 .nm{font-size:1rem}.seqsus .nm{font-size:1.1rem}
.seqk{text-align:center;margin:4px 0 0;font-size:1.15rem}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stgrid .btn{min-height:64px;font-size:1.05rem}.stgrid .btn.cur{outline:3px solid var(--sig);outline-offset:2px}
body:has(.padwrap) .toast{bottom:auto;top:max(12px,env(safe-area-inset-top))} /* Hinweis nicht über die Noten-Tasten legen */
.pad button{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--acc);color:var(--acc-ink)}
.btn.ss{padding:8px 12px;font-size:.88rem}.btn.ss.on{background:var(--news);border-color:var(--sig)}
.hide{letter-spacing:2px;color:var(--muted);font-size:.7em}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.tbl th,.tbl td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl thead th{font-size:.78rem;color:var(--muted);font-weight:700}.tbl tbody tr{cursor:pointer}.tbl .num{text-align:right}.tbl .verl{white-space:normal;font-weight:700}
.tbl .old{color:var(--down);font-weight:700}
.obsl{list-style:none;padding:0;margin:8px 0}.obsl li{display:flex;align-items:center;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.head{display:flex;align-items:center;gap:10px;margin:2px 0 4px}.head .kl{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:60;max-width:min(92vw,520px);min-height:44px;padding:10px 16px;border:0;border-radius:14px;background:var(--sig);color:var(--sig-ink);font:600 1rem/1.3 system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.18)}@media print{.updbar{display:none}}
/* App-Sperre */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px;overflow:auto}
#lock .box{max-width:340px;width:100%;text-align:center}
#lock h1{justify-content:center}#lock h1::before{display:none}
#lock .pins{display:flex;justify-content:center;gap:14px;margin:18px 0 8px}
#lock .pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}#lock .pins i.on{background:var(--ink)}
#lock .pins.bad{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#lock .keys{display:grid;grid-template-columns:repeat(3,70px);justify-content:center;gap:14px 22px;margin:12px auto 0}
#lock .keys button{width:70px;height:70px;padding:0;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:1.5rem;font-weight:700}
#lock .keys button.nb{border:none;background:none;font-size:.8rem;font-weight:600;color:var(--muted)}#lock .keys button.nb:last-child{font-size:1.3rem;color:var(--ink)}
body.locked #app,body.locked #nav,body.locked .cele:not(.lockdlg),body.locked .toast{visibility:hidden}
@media (prefers-reduced-motion:reduce){#lock .pins.bad{animation:none}}
@media print{nav,.noprint,body::before{display:none!important}main{padding:0}#lock{display:none!important}}
.betab{position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:10px;z-index:50;background:var(--sig,#e3a008);color:#2b2420;font:700 .7rem/1 system-ui,sans-serif;letter-spacing:.06em;padding:5px 8px;border-radius:8px;pointer-events:none}@media (display-mode:standalone){.betab{top:calc(env(safe-area-inset-top) + 34px)}}@media print{.betab{display:none}}

<body><div class="betab" aria-label="Beta-Version">BETA</div>
<main id="app"></main>
<nav id="nav" class="noprint"></nav>
<script>
"use strict";
/* ===== Speicher =====
   Technik-Kern übernommen aus Pfad 1.1.3 (hbg-pfad/pfad, quelle/pfad.html). Liste der Bausteine: docs/technik-aus-pfad.md */
const SOMI_VERSION="0.4.4 Beta",SOMI_STAND="05.11.2026";
const KEY="somi-beta";
const FAECHER=["Mathe","Sport"];
const KURSE={"-":"ohne Kurs","E":"E-Kurs","G":"G-Kurs"};
const PROFILE={r:"Regel",na:"Nachteilsausgleich",zd:"zieldifferent (LE)"};
const FRIST_JAHRE=5; // VO-DV I § 9 Abs. 1: „alle übrigen Daten“, ab Ende des Kalenderjahres der Archivierung
let db;
// Mit App-Sperre liegt im Speicher nur ein verschlüsselter Umschlag {somiEnc,salt,iv,ct}; db bleibt bis zum Entsperren leer
let ENCWAIT=null,LKEY=null;
const leer=()=>({v:1,sus:[],groups:[],obs:[],att:[],ka:[],asv:[],rl:[],del:[]});
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(db?.somiEnc){ENCWAIT=db;db={...leer(),lock:{salt:ENCWAIT.salt,after:ENCWAIT.after??1,len:ENCWAIT.len||4}}}
  migrate()}
function migrate(){if(!db||!Array.isArray(db.sus)||!Array.isArray(db.groups))db=leer();db.del??=[];if(!Array.isArray(db.obs))db.obs=[];if(!Array.isArray(db.att))db.att=[];if(!Array.isArray(db.ka))db.ka=[];if(!Array.isArray(db.asv))db.asv=[];if(!Array.isArray(db.rl))db.rl=[];
  const n=db.sus.length+db.groups.length+db.obs.length+db.att.length+db.ka.length+db.asv.length+db.rl.length;db.sus=db.sus.filter(okSus);db.groups=db.groups.filter(okGroup);db.obs=db.obs.filter(okObs);db.att=db.att.filter(okAtt);db.ka=db.ka.filter(okKa);db.asv=db.asv.filter(okAsv);db.rl=db.rl.filter(okRl);
  if(db.sus.length+db.groups.length+db.obs.length+db.att.length+db.ka.length+db.asv.length+db.rl.length<n)setTimeout(()=>toast("Beschädigte Einträge wurden beiseitegelegt."),600)}
function applyTheme(){const t=db?.theme,r=document.documentElement;if(t==="light"||t==="dark")r.dataset.theme=t;else delete r.dataset.theme;
  if(db?.fs==="l"||db?.fs==="xl")r.dataset.fs=db.fs;else delete r.dataset.fs;
  const dark=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches);document.querySelector('meta[name=theme-color]')?.setAttribute("content",dark?"#14201b":"#f5f6f1")}
let SAVEQ=Promise.resolve(),SAVEN=0;
function save(){if(ENCWAIT)return; // gesperrt und noch nicht entschlüsselt: nichts überschreiben
  if(db.lock&&LKEY){const n=++SAVEN,key=LKEY,json=JSON.stringify(db),meta={somiEnc:1,salt:db.lock.salt,after:db.lock.after,len:db.lock.len};
    SAVEQ=SAVEQ.then(async()=>{const body=await gcm(key,enc(json));if(n===SAVEN)localStorage.setItem(KEY,JSON.stringify({...meta,...body}))}).catch(()=>toast("Speichern nicht möglich. Bitte sichern."))}
  else try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast("Speichern nicht möglich. Bitte sichern.")}}

/* ===== Helfer ===== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Kennungen in onclick immer über ja(): als JS-Text verpackt und für das HTML-Attribut maskiert
const ja=s=>esc(JSON.stringify(String(s??"")));
const dDEy=s=>s?s.slice(8,10)+"."+s.slice(5,7)+"."+s.slice(0,4):"";
const byNum=(a,b)=>a.localeCompare(b,"de",{numeric:true});
// Daten aus Dateien: nur gültige Kennungen und Typen, sonst wird der Eintrag abgelehnt
const okId=s=>typeof s==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(s),okDate=s=>typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const okStr=(s,n=4000)=>s==null||typeof s==="string"&&s.length<=n,okNum=v=>v==null||typeof v==="number"&&isFinite(v);
const okSY=s=>typeof s==="string"&&/^\d{4}\/\d{2}$/.test(s);
function okSus(s){try{return !!s&&okId(s.id)&&typeof s.code==="string"&&s.code.length<=40&&okStr(s.cls,20)&&okStr(s.icon,16)&&Object.hasOwn(PROFILE,s.profil||"r")&&okStr(s.na,2000)&&(s.zdNote==null||typeof s.zdNote==="boolean")&&okNum(s.upd)}catch(e){return false}}
function okGroup(g){try{return !!g&&okId(g.id)&&FAECHER.includes(g.fach)&&okStr(g.cls,20)&&Object.hasOwn(KURSE,g.kurs||"-")&&okSY(g.sy)&&Array.isArray(g.members)&&g.members.length<=60&&g.members.every(okId)&&(g.arch==null||okDate(g.arch))&&(g.lastK==null||Object.hasOwn(KMAP,g.lastK))&&(g.lastKs==null||Array.isArray(g.lastKs)&&g.lastKs.length<=12&&g.lastKs.every(k=>Object.hasOwn(KMAP,k)))&&(g.lastM==null||Object.hasOwn(AMAP,g.lastM))&&okNum(g.upd)}catch(e){return false}}
const okSetting={theme:t=>["system","light","dark"].includes(t),fs:f=>["m","l","xl"].includes(f),hausa:v=>typeof v==="boolean",werkz:v=>typeof v==="boolean",stw:v=>okStw(v),kgw:v=>okKgw(v),kaTend:v=>typeof v==="boolean",kaw:v=>okKaw(v)};

function okKaR(r,max){return !!r&&typeof r==="object"&&!Array.isArray(r)&&Object.keys(r).length<=60&&Object.entries(r).every(([k,x])=>okId(k)&&!!x&&typeof x==="object"&&!Array.isArray(x)
  &&(x.mx==null||max!=null&&okP(x.mx,1000)&&x.mx>0)&&(x.p==null||max!=null&&okP(x.p,x.mx||max))&&(x.n==null||max==null&&NOTEN.includes(x.n))&&(x.st==null||Object.hasOwn(KAST,x.st))&&(x.na==null||typeof x.na==="boolean")&&okStr(x.nat,300))}
const plNote=a=>!!a.k&&KMAP[a.k]?.pl==="n";
function okKa(a){try{return !!a&&okId(a.id)&&okId(a.gid)&&typeof a.t==="string"&&a.t.trim().length>0&&a.t.length<=80&&okDate(a.d)&&(a.k==null||!!KMAP[a.k]?.pl)
  &&(plNote(a)?a.max==null&&a.sk==null:okP(a.max,1000)&&a.max>0&&Object.hasOwn(KASCHL,a.sk))&&okKaR(a.r,plNote(a)?null:a.max)&&(a.demo==null||typeof a.demo==="boolean")&&okNum(a.upd)}catch(e){return false}}
const kaTend=()=>db.kaTend!==false;
const kaById=id=>db.ka.find(a=>a.id===id);
const kaOf=(gid,from,pl)=>db.ka.filter(a=>a.gid===gid&&!a.k===!pl&&(!from||a.d>=from)).sort((a,b)=>a.d.localeCompare(b.d)||a.upd-b.upd);
const plOf=(gid,from)=>kaOf(gid,from,true);
// Gesonderte Leistungen als zusätzliche Einträge der Sonstigen Mitarbeit (nur lesen; bearbeitet wird in der Liste)
const plObs=(gid,sid,from)=>plOf(gid,from).flatMap(a=>(sid?[sid]:Object.keys(a.r)).map(id=>{const n=kaNote(a,id);return n?{id:a.id+"~"+id,gid,sid:id,k:a.k,n,d:a.d,t:a.t,pl:a.id,upd:a.upd}:null}).filter(Boolean));
// Mindestpunkte für die Noten 1 bis 5, auf halbe Punkte gerundet
const kaGr=(sk,max)=>(KASCHL[sk]||KASCHL["-"]).map(q=>Math.round(max*q/100*2)/2);
function kaNoteP(sk,max,p){if(p==null)return null;const gr=kaGr(sk,max);let n=6;for(let i=0;i<5;i++)if(p>=gr[i]){n=i+1;break}
  if(!kaTend()||n===6)return String(n);
  // Tendenz: jede Notenstufe in drei gleich große Punktbereiche geteilt (nicht im SILP, Nicks Festlegung)
  const lo=gr[n-1],hi=n===1?max:gr[n-2],t=hi>lo?(p-lo)/(hi-lo):.5;return t>=2/3?n+"+":t<1/3?n+"-":String(n)}
const kaNote=(a,sid)=>{const x=a.r[sid];if(!x||x.st)return null;if(plNote(a))return x.n||null;return x.p==null?null:kaNoteP(a.sk,x.mx||a.max,x.p)};
function kaMean(gid,sid,from){const n=kaOf(gid,from).map(a=>kaNote(a,sid)).filter(Boolean);return n.length?n.reduce((s,x)=>s+nWert(x),0)/n.length:null}
// Gesamtvorschlag: Anteil der schriftlichen Leistungen je Fach einstellbar (db.kaw), Mathe nach SILP 60 %
const KAW0={Mathe:60,Sport:20};
const kaw=fach=>(db.kaw&&db.kaw[fach]!=null?db.kaw[fach]:KAW0[fach]??50);
const okKaw=v=>!!v&&typeof v==="object"&&!Array.isArray(v)&&Object.keys(v).every(k=>FAECHER.includes(k)&&Number.isInteger(v[k])&&v[k]>=10&&v[k]<=90&&v[k]%10===0);
const gesamt=(somi,ka,fach="Mathe")=>somi==null||ka==null?null:(1-kaw(fach)/100)*somi+kaw(fach)/100*ka;
const kaL=(g,pl)=>pl?["Gesonderte Leistung","Präsentation, Heft, Übung"]:g.fach==="Mathe"?["Klassenarbeit","Klassenarbeiten"]:["Schriftliche Überprüfung","Schriftliche Überprüfungen"];
const kaStL=(a,st)=>a.k?{fehlt:"fehlt",nach:"holt nach"}[st]:KAST[st];
const wTxt=g=>`${kaL(g)[1]} ${kaw(g.fach)} %, Sonstige Mitarbeit ${100-kaw(g.fach)} %`;
function setKaw(fach,n){if(!FAECHER.includes(fach)||!okKaw({[fach]:n}))return;const o={...(db.kaw||{}),[fach]:n};if(n===KAW0[fach])delete o[fach];if(Object.keys(o).length)db.kaw=o;else delete db.kaw;save();render()}
const kaSt=a=>{const v=Object.values(a.r);return {p:v.filter(x=>(x.p!=null||x.n)&&!x.st).length,fehlt:v.filter(x=>x.st==="fehlt").length,nach:v.filter(x=>x.st==="nach").length}};

  :`<p class="muted">Noch nichts angelegt.</p>`}
  <p class="muted small">${PL?"Präsentationen, Portfolio/Heft und Schriftliche Übungen zählen zur Sonstigen Mitarbeit, jeweils als eigenes Kriterium (Gewicht unter Einstellungen). Bei der Schriftlichen Übung trägst du Punkte ein, sonst direkt die Note.":`Du trägst Punkte ein, SoMi rechnet die Note nach dem Prozentschlüssel aus SILP Mathe 4.3${g.fach==="Mathe"?"":" (Sport hat keinen eigenen Schlüssel)"}. Im Gesamtvorschlag: ${wTxt(g)} (Einstellungen).`}</p>`}
function addKa(gid){const g=groupById(gid);if(!g||g.arch)return;const PL=!!view.plm,k=PL?KD.k:null;
  if(PL&&!PLK.some(x=>x.k===k))return toast("Bitte die Art wählen.");const note=PL&&KMAP[k].pl==="n";
  const t=KD.t.trim()||(PL?KMAP[k].t:""),max=note?null:parseP(KD.max);
  if(!t)return toast("Bitte einen Titel eintragen.");if(looksLikeName(t))toast("Bitte keine Namen in den Titel schreiben.");
  if(!note&&!(max>0&&max<=1000))return toast("Bitte die Höchstpunktzahl eintragen, z. B. 40.");if(!okDate(KD.d))return toast("Bitte ein Datum wählen.");
  const a=touch({id:uid(),gid,t,d:KD.d,...(note?{}:{max,sk:Object.hasOwn(KASCHL,KD.sk)?KD.sk:"-"}),...(k?{k}:{}),r:{},...(g.demo?{demo:true}:{})});db.ka.push(a);KD=null;KE={kid:a.id,i:0};save();
  go({tab:view.tab,group:gid,ka:gid,plm:PL,kad:a.id})}

  const spg=[1,2,3,4,5,6].map(n=>ms.filter(s=>{const x=kaNote(a,s.id);return x&&Math.round(nWert(x))===n}).length),sum=spg.reduce((s,x)=>s+x,0);
  const schnitt=sum?spg.reduce((s,x,i)=>s+x*(i+1),0)/sum:null;

  ${ro||!ms.length?"":kaCard(a,ms)}
  <div class="card"><b>Notenspiegel</b><div class="spg" style="margin-top:8px">${spg.map((x,i)=>`<div><span class="muted small">${i+1}</span><b>${hid(String(x))}</b></div>`).join("")}</div>

function kaCard(a,ms){if(KE.i>=ms.length)return `<div class="card seqdone"><b style="font-size:1.2rem">Alle durch</b><p>${kaSt(a).p} von ${ms.length} mit Punkten.</p>

  const s=ms[KE.i],x=a.r[s.id]||{},zd=(s.profil||"r")==="zd",na=s.profil==="na",max=x.mx||a.max;

  <p style="margin:6px 0 0"><button class="btn block" onclick="KE.i++;render()">Ohne Note weiter ›</button></p></div>`;

  ${na?`<label class="swr"><span class="grow">Nachteilsausgleich gewährt<span class="sub">${s.na?esc(s.na):"Im Profil steht noch kein Nachteilsausgleich."}</span></span><input type="checkbox" class="sw" ${x.na?"checked":""} onchange="kaNa(this.checked)"></label>

function kaCur(){const a=kaById(KE.kid),g=a&&groupById(a.gid);if(!a||!g||g.arch)return {};return {a,g,s:msOf(g)[KE.i]}}
const kaFocus=()=>{const el=$("#kp");if(el){el.focus();el.select?.()}};
function kaSave(){const {a,s}=kaCur();if(!s)return;const v=parseP($("#kp")?.value),x={...(a.r[s.id]||{})},max=x.mx||a.max;
  if(Number.isNaN(v)||v!=null&&(v<0||v>max))return toast(`Bitte eine Zahl von 0 bis ${fmtP(max)}.`);
  if(v==null){if(x.p!=null||x.st){delete x.p;delete x.st}}else{x.p=v;delete x.st}
  if(Object.keys(x).length)a.r[s.id]=x;else delete a.r[s.id];touch(a);save();
  const n=kaNote(a,s.id);KE.i++;render();kaFocus();if(v!=null)toast(`${s.code}: ${fmtP(v)} Punkte${SHOW&&n?" · Note "+nTxt(n):""}`)}
function kaSetSt(st){const {a,s}=kaCur();if(!s||!Object.hasOwn(KAST,st))return;const x={...(a.r[s.id]||{}),st};delete x.p;delete x.n;a.r[s.id]=x;touch(a);save();KE.i++;render();kaFocus();toast(`${s.code}: ${kaStL(a,st)}`)}
function kaSetN(n){const {a,s}=kaCur();if(!s||!plNote(a)||!NOTEN.includes(n))return;const x={...(a.r[s.id]||{}),n};delete x.st;a.r[s.id]=x;touch(a);save();KE.i++;render();toast(`${s.code} gespeichert${SHOW?": "+nTxt(n):""}`)}
function kaMx(t){const {a,s}=kaCur();if(!s)return;const v=parseP(t),x={...(a.r[s.id]||{})};
  if(Number.isNaN(v)||v!=null&&!(v>0&&v<=1000))return render(),toast("Bitte eine Zahl größer als 0.");
  if(v!=null&&x.p!=null&&x.p>v)return render(),toast("Es sind schon mehr Punkte eingetragen.");
  if(v==null)delete x.mx;else x.mx=v;a.r[s.id]=x;touch(a);save();render();kaFocus()}
function kaNa(on){const {a,s}=kaCur();if(!s)return;a.r[s.id]={...(a.r[s.id]||{}),na:!!on};touch(a);save()}
function kaNat(t){const {a,s}=kaCur();if(!s)return;const v=String(t).trim().slice(0,300);if(v&&looksLikeName(v.split(/\s+/)[0]))toast("Bitte keine Namen eintragen.");
  const x={...(a.r[s.id]||{})};if(v)x.nat=v;else delete x.nat;a.r[s.id]=x;touch(a);save()}
function kaEdit(f,v){const a=kaById(view.kad),g=a&&groupById(a.gid);if(!a||!g||g.arch)return;
  if(f==="t"){const t=String(v).trim().slice(0,80);if(!t)return render(),toast("Der Titel darf nicht leer sein.");a.t=t}
  else if(f==="d"){if(!okDate(v))return render();a.d=v}

  if(view.mark)requestAnimationFrame(()=>$("#app .mark")?.scrollIntoView({block:"center",behavior:"smooth"}));
}

/* ===== Eigene Dialoge (funktionieren auch dort, wo confirm/prompt blockiert sind) ===== */
function dlg(html,onMount){return new Promise(res=>{const el=document.createElement("div");el.className="cele"+(LOCKED?" lockdlg":"");el.style.zIndex=LOCKED?120:40;
  el.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(el);
  const done=v=>{el.remove();res(v)};el.onclick=e=>{if(e.target===el)done(null)};onMount(el,done)})}
async function ask(msg,o={}){const r=await dlg(`<p style="font-weight:700;font-size:1.05rem;margin:0 0 ${o.sub?6:16}px">${esc(msg)}</p>${o.sub?`<p class="small muted" style="margin:0 0 16px">${esc(o.sub)}</p>`:""}
  <div class="duo"><button class="btn" data-a="0">${esc(o.cancel||"Abbrechen")}</button><button class="btn pri" data-a="1" style="${o.danger?"background:var(--down);border-color:var(--down)":""}">${esc(o.ok||"OK")}</button></div>`,
  (el,done)=>{el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>done(b.dataset.a==="1"));el.querySelector('[data-a="1"]').focus()});return r===true}
async function askText(msg,ph,type){return dlg(`<p style="font-weight:700;margin:0 0 10px">${esc(msg)}</p><input id="dlgIn" type="${type||"text"}" autocomplete="${type==="password"?"current-password":"off"}" placeholder="${esc(ph||"")}">
  <div class="duo" style="margin-top:14px"><button class="btn" data-a="0">Abbrechen</button><button class="btn pri" data-a="1">OK</button></div>`,
  (el,done)=>{const i=el.querySelector("#dlgIn");i.focus();i.onkeydown=e=>{if(e.key==="Enter")done(i.value)};el.querySelector('[data-a="0"]').onclick=()=>done(null);el.querySelector('[data-a="1"]').onclick=()=>done(i.value)})}

/* ===== Gerät: dauerhafter Speicher, Offline, Home-Bildschirm ===== */
const isWeb=/^https?:$/.test(location.protocol),standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
try{navigator.storage?.persist?.()}catch(e){}
if(isWeb&&"serviceWorker" in navigator){const hadSW=!!navigator.serviceWorker.controller;navigator.serviceWorker.register("sw.js").catch(()=>{});
  /* Neue Fassung geladen: nicht von selbst neu laden (sonst gehen halb ausgefüllte Eingaben verloren), sondern Knopf anbieten (wie Pfad 1.2.0) */
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!hadSW||document.querySelector(".updbar"))return;
    const b=document.createElement("button");b.className="updbar";b.type="button";b.textContent="Neue Version von SoMi geladen. Tippe hier zum Aktualisieren.";
    b.addEventListener("click",()=>location.reload());document.body.appendChild(b)})}
function envHint(){if(sessionStorage.getItem("hideEnv"))return "";
  const x=`<button class="btn ghost small" onclick="sessionStorage.setItem('hideEnv',1);render()">Ausblenden</button>`;
  if(!isWeb)return `<div class="card" style="border:2px solid var(--new)"><b>Achtung: Vorschau-Modus</b><p class="small" style="margin:6px 0">Die App läuft gerade als Datei. Dort kann das Gerät die Daten jederzeit löschen. Öffne sie über ihre Internetadresse und speichere regelmäßig eine Sicherung.</p>${x}</div>`;
  if(isIOS&&!standalone)return `<div class="card"><b>Tipp: Als App installieren</b><p class="small" style="margin:6px 0">Tippe in Safari auf „Teilen“ und dann „Zum Home-Bildschirm“. Dann startet SoMi wie eine App, funktioniert offline und Safari löscht die Daten nicht nach einigen Wochen ohne Nutzung. Trag hier im Safari-Tab nichts ein: Das App-Symbol hat einen eigenen Speicher.</p>${x}</div>`;
  return ""}

/* ===== Einrichtung: drei Schritte ===== */
const SETUP=[
 {k:"lock",t:"Code für die App-Sperre festlegen",done:()=>!!db.lock,tip:"Schalte die App-Sperre ein und lege einen Code fest."},
 {k:"demo",t:"Fiktive Beispielklasse laden",done:()=>db.groups.length>0,tip:"Tippe auf „Fiktive Beispielklasse laden“."},
 {k:"backup",t:"Erste Sicherung speichern",done:()=>!!db.lastBackup,tip:"Tippe auf „Sicherung speichern“ und lege ein Passwort fest."}];
const setupOpen=()=>db.setupDone?[]:SETUP.filter(s=>!s.done());
function setupCard(){const open=setupOpen();if(!open.length)return "";const nx=open[0];
  return `<div class="card" style="border:2px solid var(--sig)"><b>Einrichtung: noch ${open.length} von ${SETUP.length} Schritten</b>
  <ul class="chk">${SETUP.map(s=>`<li class="${s.done()?"ok":""}">${s.done()?"✓":"○"} ${s.t}</li>`).join("")}</ul>
  <p class="row" style="margin:0;flex-wrap:wrap"><button class="btn pri" onclick="go({tab:'profil',mark:'${nx.k}'})">${nx.t}</button><span class="grow"></span><button class="btn ghost small" onclick="db.setupDone=1;save();render()">Später</button></p></div>`}
function markFor(k){if(view.tab!=="profil"||!view.mark)return null;
  const s=SETUP.find(x=>x.k===view.mark);
  if(s&&s.done()){const nx=SETUP.find(x=>!x.done());view.mark=nx?nx.k:null;if(!nx){db.setupDone=1;save();setTimeout(()=>toast("Einrichtung fertig"),400)}}
  return view.mark===k?SETUP.find(x=>x.k===k).tip:null}
const mk=k=>markFor(k)?" mark":"";
const mtip=k=>{const t=markFor(k);return t?`<div class="marktip">↓ ${t}</div>`:""};

/* ===== Heute ===== */
const own=()=>db.groups.filter(g=>!g.demo);
function backupHint(){const n=own().length,last=db.lastBackup||0,days=(Date.now()-last)/864e5;
  if(!n||days<3)return ""; // Noten wiegen schwerer: Erinnerung nach 3 Tagen (Pfad: 5)
  return `<div class="card row"><div class="grow small"><b>Sicherung fällig.</b> ${last?`Letzte vor ${Math.floor(days)} Tagen.`:"Noch keine Sicherung."} Ohne Sicherung sind die Daten weg, wenn das Gerät verloren geht, das App-Symbol gelöscht oder der Browserspeicher geleert wird.</div><button class="btn pri" onclick="exportJSON()">Sichern</button></div>`}
// Aufbewahrung: 5 Jahre ab Ende des Kalenderjahres, in dem die Lerngruppe archiviert wurde. Gelöscht wird nur nach Rückfrage.
const keepUntil=g=>`${+g.arch.slice(0,4)+FRIST_JAHRE}-12-31`;
const due=()=>db.groups.filter(g=>g.arch&&!g.demo&&keepUntil(g)<today());
function dueHint(){const d=due();if(!d.length)return "";
  return `<div class="card" style="border:2px solid var(--new)"><b>Aufbewahrungsfrist abgelaufen</b><p class="small" style="margin:6px 0 8px">Diese archivierten Lerngruppen musst du nicht mehr aufbewahren: ${d.map(g=>esc(gName(g))+" ("+esc(g.sy)+")").join(", ")}. Prüfe, ob du sie löschen möchtest. SoMi löscht nichts von selbst.</p>
  <p class="row" style="flex-wrap:wrap;margin:0">${d.map(g=>`<button class="btn" onclick="go({tab:'gruppen',group:${ja(g.id)}})">${esc(gName(g))} ansehen</button>`).join("")}</p></div>`}
function heuteV(){
  const dateLong=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  const act=db.groups.filter(g=>!g.arch).sort((a,b)=>byNum(gName(a),gName(b)));
  let h=`<div class="head">${LOGO}<span class="kl"><b>HBG Köln</b> · SoMi</span></div><p class="muted">${dateLong}</p><h1>Heute</h1>${envHint()}${setupCard()}${backupHint()}${dueHint()}`;
  const rh=rlHint();
  h+=`<div class="stat"><div>Lerngruppen<b>${act.length}</b><span class="muted small">aktiv</span></div><div>Schüler:innen<b>${new Set(act.flatMap(g=>g.members)).size}</b><span class="muted small">in aktiven Gruppen</span></div><div>Archiv<b>${db.groups.filter(g=>g.arch).length}</b><span class="muted small">Gruppen</span></div></div>`;
  if(!act.length)return h+`<div class="card"><p>Noch keine Lerngruppen.</p><p class="muted">Lege unter „Lerngruppen“ eine Gruppe an oder lade unter „Einstellungen“ die fiktive Beispielklasse.</p><p><button class="btn pri" onclick="go({tab:'gruppen',adding:true})">Lerngruppe anlegen</button></p></div>`;
  if(act.length)h+=`<div class="card"><b>Schnell erfassen</b><p class="row" style="flex-wrap:wrap;margin:8px 0 0">${act.map(g=>`<span class="row" style="gap:6px;flex-wrap:wrap">${g.fach==="Mathe"?`<button class="btn pri" onclick="erStart(${ja(g.id)},'k')">${esc(gName(g))}: ganze Klasse</button><button class="btn" onclick="erStart(${ja(g.id)},'e')">Einzeln</button>`:`<button class="btn pri" onclick="erStart(${ja(g.id)},'k')">${esc(gName(g))}: Stundenstatus</button>`}</span>`).join("")}</p></div>`;
  h+=rh+`<h2>Deine Lerngruppen</h2>`+act.map(groupCard).join("");
  return h+`<p class="muted small">Version 0.4: Sonstige Mitarbeit, gesonderte Leistungen (Präsentation, Heft, Übung) und Klassenarbeiten in Mathe, Stundenstatus und schriftliche Überprüfungen in Sport, Rücklauf-Listen. Sport-Noten folgen in Version 0.5.</p>`}
const groupCard=g=>`<button class="card tap row" onclick="go({tab:'gruppen',group:${ja(g.id)}})"><div class="grow"><div class="code">${esc(gName(g))}${g.demo?' <span class="tag">Beispiel</span>':""}</div><div class="muted small">${esc(g.sy)} · ${g.members.length} Schüler:innen${g.arch?` · archiviert am ${dDEy(g.arch)}`:""}</div></div><span aria-hidden="true" class="muted">›</span></button>`;

function gruppenV(){
  const act=db.groups.filter(g=>!g.arch).sort((a,b)=>byNum(gName(a),gName(b))),arch=db.groups.filter(g=>g.arch).sort((a,b)=>b.arch.localeCompare(a.arch));

    <label for="gcls">Klasse</label><input id="gcls" value="${esc(GD.cls)}" placeholder="z. B. 7B" maxlength="20" oninput="GD.cls=this.value">
    <label>Kurs</label><div class="sub">Mathe hat ab Klasse 7 E- und G-Kurse. Danach richtet sich der Notenschlüssel der Klassenarbeiten.</div><div class="pick">${Object.entries(KURSE).map(([k,t])=>`<button class="${GD.kurs===k?"on":""}" onclick="GD.kurs='${k}';render()">${t}</button>`).join("")}</div>
    <div class="duo" style="margin-top:14px"><button class="btn" onclick="GD=null;view.adding=false;render()">Abbrechen</button><button class="btn pri" onclick="addGroup()">Anlegen</button></div></div>`
  :`<p><button class="btn pri" onclick="GD={fach:'Mathe',cls:'',kurs:'-'};render();$('#gcls')?.focus()">+ Lerngruppe</button></p>`}
  ${act.length?act.map(groupCard).join(""):`<p class="muted">Noch keine aktiven Lerngruppen.</p>`}
  ${arch.length?`<details class="card"><summary style="font-weight:800">Archiv (${arch.length})</summary><p class="muted small">Archivierte Gruppen sind nur lesbar. Aufbewahrung ${FRIST_JAHRE} Jahre ab Ende des Kalenderjahres der Archivierung (VO-DV I § 9).</p>${arch.map(groupCard).join("")}</details>`:""}`}
function addGroup(){const cls=GD.cls.trim().toUpperCase();if(!cls)return toast("Bitte die Klasse eintragen, z. B. 7B.");
  if(looksLikeName(GD.cls))return toast("Bitte nur die Klasse eintragen, keinen Namen.");
  if(db.groups.some(g=>!g.arch&&g.cls===cls&&g.fach===GD.fach&&(g.kurs||"-")===GD.kurs))return toast("Diese Lerngruppe gibt es schon.");
  const g=touch({id:uid(),fach:GD.fach,cls,kurs:GD.kurs,sy:syNow(),members:[],arch:null});db.groups.push(g);GD=null;save();go({tab:"gruppen",group:g.id})}
let SD=null; // Entwurf „Schüler:in hinzufügen“
const nextCode=cls=>{let i=1;const taken=new Set(db.sus.map(s=>s.code.toLowerCase()));while(taken.has(`${cls}-${String(i).padStart(2,"0")}`.toLowerCase()))i++;return `${cls}-${String(i).padStart(2,"0")}`};
function namesV(){const g=groupById(view.names);if(!g){view={tab:"gruppen",group:view.names};return groupV()}const ms=msOf(g);
  const head=`<button class="btn ghost" onclick="back()">‹ Zurück</button><h1 style="margin-bottom:4px">Namen</h1><p class="muted" style="margin-top:0">${esc(gName(g))}</p>`;
  if(!db.lock||!LKEY)return head+`<div class="card"><p>Namen gehen nur mit App-Sperre. So sind sie verschlüsselt und nur nach Eingabe deines Codes sichtbar.</p><p style="margin-bottom:0"><button class="btn pri" onclick="go({tab:'profil'})">Zur App-Sperre</button></p></div>`;
  return head+`<div class="card"><p class="small muted" style="margin-top:0">Die Namen liegen nur auf diesem Gerät, verschlüsselt und getrennt von den Noten. Sie stehen nicht in der normalen Sicherung. Sichere sie unter „Einstellungen“ → „Namensliste sichern“.</p>
  ${ms.map(s=>`<label class="row" style="margin:8px 0;font-weight:600"><span class="code" style="min-width:5.5em">${esc(s.code)}</span><input class="grow" data-sid="${esc(s.id)}" maxlength="60" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(NAMES[s.id]||"")}" placeholder="Name" aria-label="Name zu ${esc(s.code)}"></label>`).join("")}
  <p style="margin-bottom:0"><button class="btn pri block" onclick="saveNamesV()">Namen speichern</button></p></div>`}
function saveNamesV(){if(!db.lock||!LKEY)return;let n=0;
  document.querySelectorAll("#app input[data-sid]").forEach(i=>{const sid=i.dataset.sid,v=i.value.trim().slice(0,60);if(!susById(sid))return;if(v){NAMES[sid]=v;n++}else delete NAMES[sid]});
  saveNames();back();toast(n?`${n} ${n===1?"Name":"Namen"} gespeichert`:"Namen entfernt")}
function groupV(){const g=groupById(view.group);if(!g){view={tab:"gruppen"};return gruppenV()}
  const ms=g.members.map(susById).filter(Boolean).sort((a,b)=>byNum(a.code,b.code)),ro=!!g.arch;
  const others=db.sus.filter(s=>!g.members.includes(s.id)&&s.cls===g.cls).sort((a,b)=>byNum(a.code,b.code));
  return `<button class="btn ghost" onclick="back()">‹ Zurück</button>
  <h1>${esc(gName(g))}</h1><p class="muted">${esc(g.sy)} · ${KURSE[g.kurs||"-"]} · ${ms.length} Schüler:innen${g.demo?" · fiktives Beispiel":""}</p>
  ${ro?`<div class="card" style="border:2px solid var(--line)"><b>Archiviert am ${dDEy(g.arch)}</b><p class="small" style="margin:6px 0">Aufbewahren bis ${dDEy(keepUntil(g))}. Danach fragt SoMi, ob du die Gruppe löschen möchtest.</p>
    <p class="row" style="flex-wrap:wrap;margin:0"><button class="btn" onclick="unarchive(${ja(g.id)})">Wieder aktivieren</button><button class="btn ghost danger" onclick="delGroup(${ja(g.id)})">Löschen</button></p></div>`:""}
  ${ro?"":SD?`<div class="card"><b>Schüler:in hinzufügen</b>
    <div class="sub" style="margin-top:6px">Nur Kürzel nach dem Muster Klasse-Nummer. Namen trägst du getrennt unter „Namen eintragen“ ein.</div>

    :`<p class="row" style="flex-wrap:wrap"><button class="btn pri" onclick="SD={code:nextCode(${ja(g.cls)})};render();$('#scode')?.focus()">+ Schüler:in</button>${others.length?`<button class="btn" onclick="addExisting(${ja(g.id)})">Aus Klasse ${esc(g.cls)} übernehmen</button>`:""}${ms.length?`<button class="btn" onclick="go({tab:view.tab,group:${ja(g.id)},names:${ja(g.id)}})">Namen eintragen</button>`:""}</p>`}
  ${g.fach==="Mathe"?`<p class="row" style="flex-wrap:wrap">${ro?"":`<button class="btn pri" onclick="erStart(${ja(g.id)},'k')">Ganze Klasse nacheinander</button><button class="btn" onclick="erStart(${ja(g.id)},'e')">Einzeln bewerten</button>`}<button class="btn" onclick="go({tab:view.tab,group:${ja(g.id)},ov:${ja(g.id)}})">Übersicht Sonstige Mitarbeit</button><button class="btn" onclick="KD=null;go({tab:view.tab,group:${ja(g.id)},ka:${ja(g.id)},plm:true})">Präsentation, Heft, Übung${plOf(g.id).length?` (${plOf(g.id).length})`:""}</button><button class="btn" onclick="KD=null;go({tab:view.tab,group:${ja(g.id)},ka:${ja(g.id)}})">Klassenarbeiten${kaOf(g.id).length?` (${kaOf(g.id).length})`:""}</button></p>`:`<p class="row" style="flex-wrap:wrap">${ro?"":`<button class="btn pri" onclick="erStart(${ja(g.id)},'k')">Stundenstatus erfassen</button>`}<button class="btn" onclick="go({tab:view.tab,group:${ja(g.id)},ov:${ja(g.id)}})">Übersicht Stundenstatus</button><button class="btn" onclick="KD=null;go({tab:view.tab,group:${ja(g.id)},ka:${ja(g.id)}})">Schriftliche Überprüfungen${kaOf(g.id).length?` (${kaOf(g.id).length})`:""}</button></p><p class="muted small">Die übrigen Noten für Sport kommen in Version 0.5.</p>`}
  <p class="row" style="flex-wrap:wrap"><button class="btn" onclick="RD=null;go({tab:view.tab,group:${ja(g.id)},rl:${ja(g.id)}})">Rückläufe${rlOf(g.id).filter(a=>!a.arch).length?` (${rlOf(g.id).filter(a=>!a.arch).length})`:""}</button></p>
  ${ms.length?ms.map(s=>`<button class="card tap row" onclick="go({tab:'gruppen',group:${ja(g.id)},sus:${ja(s.id)}})">${susIcon(s)}<div class="grow"><div class="code">${esc(s.code)}</div>${nm(s)}${(s.profil||"r")!=="r"?`<span class="tag ${s.profil}">${esc(PROFILE[s.profil])}${s.profil==="zd"?(s.zdNote?" · mit Note":" · Bericht"):""}</span>`:`<span class="muted small">Regel</span>`}</div><span aria-hidden="true" class="muted">›</span></button>`).join(""):`<p class="muted">Noch niemand in dieser Gruppe.</p>`}
  ${ro?"":`<div class="card"><b>Schuljahresende</b><p class="small muted" style="margin:6px 0 10px">Archivieren macht die Gruppe nur noch lesbar. Die Daten bleiben ${FRIST_JAHRE} Jahre erhalten (VO-DV I § 9). Gelöscht wird erst nach deiner Bestätigung.</p><button class="btn" onclick="archive(${ja(g.id)})">Lerngruppe archivieren</button></div>`}`}
function addSus(gid){const g=groupById(gid),code=SD.code.trim();if(!code)return toast("Bitte ein Kürzel eintragen.");
  if(looksLikeName(code)||!/\d/.test(code)||!/^[A-Za-z0-9ÄÖÜäöü_-]{2,20}$/.test(code))return toast("Bitte nur ein Kürzel wie 7B-01 verwenden, keinen Namen.");
  let s=db.sus.find(x=>x.code.toLowerCase()===code.toLowerCase());
  if(s&&g.members.includes(s.id))return toast("Schon in dieser Gruppe.");
  if(!s){s=touch({id:uid(),code,cls:g.cls,icon:freeIcon(g.cls),profil:"r",na:"",zdNote:false});db.sus.push(s)}
  g.members.push(s.id);touch(g);SD={code:nextCode(g.cls)};save();render();toast(`${code} hinzugefügt`);$("#scode")?.focus()}
async function addExisting(gid){const g=groupById(gid),ks=db.sus.filter(s=>!g.members.includes(s.id)&&s.cls===g.cls).sort((a,b)=>byNum(a.code,b.code));
  const sel=await dlg(`<p style="font-weight:700;margin:0 0 6px">Aus Klasse ${esc(g.cls)} übernehmen</p><p class="small muted" style="margin:0 0 10px">Diese Kürzel gibt es schon in einer anderen Lerngruppe. Profil und Symbol bleiben gleich.</p>
    <div style="max-height:46vh;overflow:auto">${ks.map(s=>`<label class="row" style="margin:6px 0;font-weight:600"><input type="checkbox" style="width:auto" value="${esc(s.id)}" checked> ${esc(s.icon||"")} ${esc(s.code)}</label>`).join("")}</div>
    <div class="duo" style="margin-top:14px"><button class="btn" data-a="0">Abbrechen</button><button class="btn pri" data-a="1">Übernehmen</button></div>`,
    (el,done)=>{el.querySelector('[data-a="0"]').onclick=()=>done(null);el.querySelector('[data-a="1"]').onclick=()=>done([...el.querySelectorAll("input:checked")].map(i=>i.value))});
  if(!sel?.length)return;sel.forEach(id=>susById(id)&&g.members.push(id));touch(g);save();render();toast(`${sel.length} übernommen`)}
async function archive(gid){const g=groupById(gid);
  if(!await ask(`${gName(g)} archivieren?`,{ok:"Archivieren",sub:`Die Gruppe ist danach nur noch lesbar. Aufbewahren bis ${dDEy(`${new Date().getFullYear()+FRIST_JAHRE}-12-31`)}.`}))return;
  g.arch=today();touch(g);save();render();undoToast("Archiviert",()=>{g.arch=null;touch(g);save();render()})}
function unarchive(gid){const g=groupById(gid);g.arch=null;touch(g);save();render();toast("Wieder aktiv")}
async function delGroup(gid){const g=groupById(gid),early=!g.demo&&g.arch&&keepUntil(g)>=today();
  if(!await ask(`${gName(g)} (${g.sy}) endgültig löschen?`,{ok:"Endgültig löschen",danger:true,sub:early?`Achtung: Die Aufbewahrungsfrist läuft noch bis ${dDEy(keepUntil(g))}. Lösche nur, wenn die Daten anderswo aufbewahrt sind.`:"Das lässt sich nicht rückgängig machen. Hast du eine Sicherung?"}))return;
  if(early&&!await ask("Wirklich vor Ablauf der Frist löschen?",{ok:"Ja, löschen",danger:true}))return;

const b64=u=>{let s="";new Uint8Array(u).forEach(c=>s+=String.fromCharCode(c));return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

function applyImport(){const d=IMP.d,dels=new Set([...db.del,...d.del]);
  const a=mergeList(db.groups,d.groups,dels),b=mergeList(db.sus,d.sus,dels),c=mergeList(db.obs,d.obs,dels),e=mergeList(db.att,d.att,dels),f=mergeList(db.ka,d.ka,dels),v=mergeList(db.asv,d.asv,dels),w=mergeList(db.rl,d.rl,dels);db.groups=a.list;db.sus=b.list;db.del=[...dels];
  const gids=new Set(db.groups.map(g=>g.id)),sids=new Set(db.sus.map(x=>x.id));db.obs=c.list.filter(o=>gids.has(o.gid)&&sids.has(o.sid));db.att=e.list.filter(o=>gids.has(o.gid)&&sids.has(o.sid));db.ka=f.list.filter(a=>gids.has(a.gid));db.asv=v.list.filter(o=>gids.has(o.gid)&&sids.has(o.sid));db.rl=w.list.filter(a=>gids.has(a.gid));
  if(IMP.settings)for(const k of ["theme","fs","hausa","werkz","stw","kgw","kaTend","kaw"])if(d[k]!=null&&okSetting[k](d[k]))db[k]=d[k];
  IMP=null;save();applyTheme();toast(`Übernommen: ${a.n} Lerngruppen, ${b.n} Schüler:innen, ${c.n+e.n+f.n+v.n+w.n} Einträge neu oder aktualisiert`);go({tab:"gruppen"})}
async function wipe(){if(!await ask("Wirklich alle Daten auf diesem Gerät löschen?",{ok:"Alles löschen",danger:true,sub:"Speichere vorher eine Sicherung. Die Aufbewahrungsfrist gilt auch hier."}))return;
  const keep={theme:db.theme,fs:db.fs,bsalt:db.bsalt,lock:db.lock,setupDone:db.setupDone};db={...leer(),...keep};dropNames();save();go({tab:"heute"})}
async function delDemo(){if(!await ask("Die fiktive Beispielklasse entfernen? Deine eigenen Lerngruppen bleiben.",{ok:"Entfernen"}))return;
  db.groups=db.groups.filter(g=>!g.demo);db.sus=db.sus.filter(s=>!s.demo);db.obs=db.obs.filter(o=>!o.demo);db.att=db.att.filter(a=>!a.demo);db.ka=db.ka.filter(a=>!a.demo);db.asv=db.asv.filter(a=>!a.demo);db.rl=db.rl.filter(a=>!a.demo);save();render();toast("Beispielklasse entfernt")}
function demo(){if(db.groups.some(g=>g.demo))return toast("Beispielklasse ist schon da");
  const prof=["r","r","na","r","zd","r","r","na"],sus=prof.map((p,i)=>touch({id:uid(),code:`DEMO-${String(i+1).padStart(2,"0")}`,cls:"DEMO",icon:ICONS[i*5%ICONS.length],profil:p,
    na:p==="na"?(i===2?"Fiktiv: 10 Minuten mehr Zeit bei Klassenarbeiten.":"Fiktiv: Ersatzaufgabe im Sport (Schiedsrichter, Helfen)."):"",zdNote:p==="zd",demo:true}));
  db.sus.push(...sus);
  const gm=touch({id:uid(),fach:"Mathe",cls:"DEMO",kurs:"-",sy:syNow(),members:sus.map(s=>s.id),arch:null,demo:true});db.obs.push(...demoObs(gm));db.ka.push(demoKa(gm),demoPl(gm));db.asv.push(...demoStoer(gm));db.rl.push(demoRl(gm));
  db.groups.push(gm,
    touch({id:uid(),fach:"Sport",cls:"DEMO",kurs:"-",sy:syNow(),members:sus.slice(0,6).map(s=>s.id),arch:null,demo:true}));
  save();toast("Beispielklasse geladen");go(view.mark?{tab:"profil",mark:"demo"}:{tab:"gruppen"})}

/* ===== App-Sperre mit Verschlüsselung (aus Pfad; in SoMi Standard an) =====
   Aus dem Code (4 bis 6 Ziffern) wird per PBKDF2 (600 000 Runden) ein AES-Schlüssel. Im Browserspeicher liegen die Daten dann
   nur verschlüsselt; der Schlüssel bleibt nur im Arbeitsspeicher, solange SoMi entsperrt ist. Code vergessen = Daten weg. */
let LOCKED=false,LOCKIN="",LOCKFAIL=0,LOCKWAIT=0,HIDDEN_AT=0;
const FAILKEY=KEY+"-sperre";try{({n:LOCKFAIL=0,bis:LOCKWAIT=0}=JSON.parse(localStorage.getItem(FAILKEY)||"{}"))}catch(e){}
const saveFail=()=>{try{LOCKFAIL?localStorage.setItem(FAILKEY,JSON.stringify({n:LOCKFAIL,bis:LOCKWAIT})):localStorage.removeItem(FAILKEY)}catch(e){}};
async function codeKey(code,salt){const base=await crypto.subtle.importKey("raw",enc(code),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(salt),iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function tryCode(c){const raw=ENCWAIT||JSON.parse(localStorage.getItem(KEY)||"null");if(!raw?.somiEnc)return null;
  try{const key=await codeKey(c,raw.salt);return {key,data:JSON.parse(dec(await ungcm(key,raw)))}}catch(e){return null}}
function askCode(msg,sub){return dlg(`<p style="font-weight:700;margin:0 0 6px">${esc(msg)}</p>${sub?`<p class="small muted" style="margin:0 0 10px">${sub}</p>`:""}<input id="dlgIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="4 bis 6 Ziffern">
  <div class="duo" style="margin-top:14px"><button class="btn" data-a="0">Abbrechen</button><button class="btn pri" data-a="1">OK</button></div>`,
  (el,done)=>{const i=el.querySelector("#dlgIn");i.focus();i.onkeydown=e=>{if(e.key==="Enter")done(i.value)};el.querySelector('[data-a="0"]').onclick=()=>done(null);el.querySelector('[data-a="1"]').onclick=()=>done(i.value)})}
function lockV(){const L=db.lock;
  return `<div class="card"><h2 style="margin-top:0">App-Sperre und Verschlüsselung</h2>${mtip("lock")}
  <label class="swr${mk("lock")}"><span class="grow">SoMi mit Code sperren und verschlüsseln<span class="sub">Zusätzlich zur Gerätesperre. Empfohlen: an.</span></span><input type="checkbox" class="sw" ${L?"checked":""} onchange="this.checked?setLock():offLock()"></label>
  ${L?`<div class="sub" style="margin:10px 0 6px;font-weight:700">Sperren, wenn SoMi im Hintergrund war</div><div class="pick">${[[0,"Sofort"],[1,"Nach 1 Min."],[5,"Nach 5 Min."]].map(([m,t])=>`<button class="${L.after===m?"on":""}" onclick="db.lock.after=${m};save();render()">${t}</button>`).join("")}</div>
  <p class="row" style="flex-wrap:wrap;margin-top:10px"><button class="btn" onclick="setLock(true)">Code ändern</button><button class="btn" onclick="lockNow()">Jetzt sperren</button></p>`
  :`<p class="small" style="color:var(--down);font-weight:700">Die Sperre ist aus. Noten liegen dann unverschlüsselt auf dem Gerät.</p>`}
  <p class="muted small" style="margin-bottom:0">Ist die Sperre an, liegen die Daten auf diesem Gerät nur verschlüsselt im Speicher. Ein Ziffern-Code schützt vor einem Blick und vor einfachem Auslesen, mit viel Aufwand ließe er sich durchprobieren. Der Gerätecode bleibt deshalb Pflicht. Wer den Code vergisst, kommt nicht mehr an die Daten und muss die letzte Sicherung laden.</p></div>`}
async function setLock(change){if(!crypto.subtle){toast("In dieser Ansicht nicht möglich. Bitte im Browser öffnen.");return render()}
  if(change){const c=await askCode("Aktuellen Code eingeben");if(c==null)return;if(!await tryCode(c))return toast("Code falsch")}
  const a=await askCode(change?"Neuen Code festlegen":"Code für SoMi festlegen","4 bis 6 Ziffern, nicht dein Gerätecode. Du gibst ihn bei jedem Start ein. Vergessen heißt: Die Daten auf diesem Gerät sind weg. Speichere deshalb regelmäßig eine Sicherung.");
  if(a==null)return render();if(!/^\d{4,6}$/.test(a)){render();return toast("Bitte 4 bis 6 Ziffern.")}
  if(await askCode("Code wiederholen")!==a){render();return toast("Die Codes stimmen nicht überein.")}
  const salt=b64(rnd(16));LKEY=await codeKey(a,salt);db.lock={salt,len:a.length,after:db.lock?.after??1};save();saveNames();await SAVEQ;await NSAVEQ;render();toast(change?"Code geändert":"SoMi ist jetzt gesperrt und verschlüsselt")}
async function offLock(){if(!await ask("App-Sperre wirklich ausschalten?",{ok:"Ausschalten",danger:true,sub:"Danach liegen Noten und Beobachtungen unverschlüsselt im Speicher dieses Geräts. Eingetragene Namen werden gelöscht."}))return render();
  const c=await askCode("Zum Ausschalten Code eingeben");
  if(c!=null&&await tryCode(c)){delete db.lock;LKEY=null;dropNames();save();render();toast("App-Sperre ist aus")}else{render();if(c)toast("Code falsch")}}
function lockNow(){if(!db.lock)return;LOCKED=true;LOCKIN="";document.body.classList.add("locked");document.activeElement?.blur?.();renderLock()}
function renderLock(msg,busy){let el=$("#lock");if(!LOCKED){el?.remove();return}
  if(!el){el=document.createElement("div");el.id="lock";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","SoMi ist gesperrt");document.body.appendChild(el)}
  const wait=Math.ceil((LOCKWAIT-Date.now())/1000),len=db.lock.len||4;
  el.innerHTML=`<div class="box"><div style="font-size:2.4rem" aria-hidden="true">🔒</div><h1 style="margin:6px 0 4px">SoMi ist gesperrt</h1>
  <p class="muted" aria-live="polite">${wait>0?`Zu viele Versuche. Warte ${wait} Sekunden.`:busy?"Wird entsperrt …":esc(msg||"Gib deinen Code ein.")}</p>
  <div class="pins${msg?" bad":""}" aria-hidden="true">${[...Array(len)].map((_,i)=>`<i class="${i<LOCKIN.length?"on":""}"></i>`).join("")}</div>
  <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="lockPress('${n}')">${n}</button>`).join("")}<button class="nb" onclick="lockForgot()">Vergessen?</button><button onclick="lockPress('0')">0</button><button class="nb" aria-label="Ziffer löschen" onclick="LOCKIN=LOCKIN.slice(0,-1);renderLock()">⌫</button></div></div>`;
  if(wait>0)setTimeout(()=>LOCKED&&renderLock(),1000)}
let LOCKBUSY=false;
async function lockPress(d){if(LOCKWAIT>Date.now()||LOCKBUSY)return;const len=db.lock.len||4;if(LOCKIN.length>=len)return;LOCKIN+=d;renderLock();if(LOCKIN.length<len)return;
  LOCKBUSY=true;renderLock("",true);const r=await tryCode(LOCKIN);LOCKBUSY=false;LOCKIN="";
  if(r){LOCKFAIL=0;LOCKWAIT=0;saveFail();LKEY=r.key;if(ENCWAIT){ENCWAIT=null;db=r.data;migrate();applyTheme();await loadNames(r.key)}LOCKED=false;document.body.classList.remove("locked");renderLock();render();return}
  LOCKFAIL++;if(LOCKFAIL>=5)LOCKWAIT=Date.now()+30000*2**Math.min(LOCKFAIL-5,10);saveFail();try{navigator.vibrate?.(80)}catch(e){}renderLock("Falscher Code. Versuch es noch einmal.")}
async function lockForgot(){if(!await ask("Code vergessen?",{ok:"Alles löschen",danger:true,sub:"Ohne Code lassen sich die Daten nicht entschlüsseln. Du kannst alles auf diesem Gerät löschen und danach deine letzte Sicherung laden."}))return;
  const keep=ENCWAIT?{}:db;ENCWAIT=null;LKEY=null;
  db={...leer(),theme:keep.theme,fs:keep.fs,bsalt:keep.bsalt,setupDone:keep.setupDone};migrate();
  localStorage.removeItem(KEY);dropNames();save();LOCKED=false;document.body.classList.remove("locked");renderLock();applyTheme();go({tab:"profil"});toast("Alles gelöscht. Lade jetzt deine letzte Sicherung und schalte die Sperre wieder ein.")}
document.addEventListener("visibilitychange",()=>{if(!db?.lock)return;if(document.hidden){HIDDEN_AT=Date.now();if(!db.lock.after)lockNow()}
  else if(!LOCKED&&HIDDEN_AT&&Date.now()-HIDDEN_AT>=db.lock.after*6e4)lockNow()});
document.addEventListener("keydown",e=>{if(!LOCKED||e.target.closest?.(".cele"))return;if(/^\d$/.test(e.key))lockPress(e.key);else if(e.key==="Backspace"){LOCKIN=LOCKIN.slice(0,-1);renderLock()}});

load();applyTheme();matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change",applyTheme);if(db.lock)lockNow();render();
</script>
