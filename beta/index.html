<style>
/* SoMi-Farben „Tafelgrün“ (eigene Farbgebung, nicht Sopäd-Team-Design) */

:root[data-theme=dark]{color-scheme:dark;--bg:#14201b;--card:#1c2a24;--ink:#e8efea;--muted:#a3b3aa;--line:#2c3d35;--soft:#22312a;

:root{font-size:16px}:root[data-fs=l]{font-size:18px}:root[data-fs=xl]{font-size:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
/* Home-Bildschirm-App: Inhalt beginnt unter Uhrzeit-Leiste und iOS-Unschärfe. Kein fester Streifen oben, sonst verschwindet Inhalt dahinter (wie Pfad 1.2.6) */

/* iPad/iPhone: kein Nachfedern am Seitenende, sonst zieht iOS die Menüleiste unten mit (wie Pfad 1.2.5) */
html,body{overscroll-behavior-y:none}
@media (min-width:900px) and (orientation:landscape){main{max-width:860px;padding-left:24px;padding-right:24px}}
h1{font-size:1.9rem;font-weight:800;margin:6px 0 12px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h1::before{content:"";width:14px;height:14px;border-radius:5px;background:var(--acc);transform:rotate(45deg);flex:none}
h2{font-size:1.1rem;margin:18px 0 8px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:.92rem}.small{font-size:.85rem}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:16px;margin-bottom:10px}
.card.tap{cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:10px 14px;font-weight:600;min-height:40px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.block{width:100%;padding:14px;border-radius:18px}
.btn.ghost{background:none;border:none;color:var(--acc);padding:8px 4px}
.btn.danger{color:var(--down)}.btn:disabled{opacity:.45;cursor:default}
.code{font-weight:800;letter-spacing:.02em;font-size:1.05rem}

.tag.na{background:var(--news);color:var(--new)}.tag.zd{background:var(--ups);color:var(--up)}
label{display:block;font-weight:600;margin:14px 0 6px}

.icgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:50vh;overflow:auto}.icgrid button{font-size:1.6rem;padding:6px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}

nav button.on{color:var(--acc)}nav button.on svg{background:var(--accs)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);max-width:min(92vw,520px);text-align:center;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:50}
.toast.undo{display:flex;gap:14px;align-items:center;text-align:left}

.duo{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}.duo .btn{padding:12px 10px}
.marktip{color:var(--sigt);font-weight:800;margin:12px 0 8px}
.mark{outline:4px solid var(--sig)!important;outline-offset:3px}
.chk{list-style:none;padding:0;margin:8px 0 12px;display:grid;gap:4px}.chk li.ok{color:var(--muted);text-decoration:line-through}
.logo{width:34px;height:34px;flex:none}
/* Erfassen */
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-weight:700;font-size:.88rem;min-height:40px}

.padwrap{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));z-index:3;background:var(--card);margin:10px -8px 4px;padding:8px;border-radius:18px;box-shadow:0 -8px 16px -12px rgba(0,0,0,.35)}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.pad.st{grid-template-columns:repeat(4,1fr)}.pad.st .nt{opacity:.7;font-weight:600}.pad.st button{min-height:58px;display:grid;grid-template-rows:auto auto auto;align-content:start;justify-items:center;align-items:center;gap:2px;padding:6px 2px}.pad.st b{font-size:1.5rem;line-height:1}.pad.st.av{grid-template-columns:repeat(3,1fr)}.pad button.cur{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.pad button.cur span{color:var(--acc-ink)}.seqrow{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}.asvrow>div+div{margin-top:8px}.seqrow .seqk{margin:0 0 6px}.btn.stb.cur{background:var(--news);border:2px solid var(--sig);color:var(--sig-ink)}.pad.st span{font-size:.75rem;font-weight:600;color:var(--muted);line-height:1.2;text-align:center}

.seqsus{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 8px}.seqsus .code{font-size:2rem}.kic.big{width:60px;height:60px;font-size:2rem}
.btn.abw{border-style:dashed}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.three .btn{padding-left:4px;padding-right:4px}
.spg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}.spg div{background:var(--soft,rgba(0,0,0,.04));border-radius:10px;padding:6px 0}.spg b{display:block;font-size:1.2rem}
.kp{font-size:1.8rem!important;text-align:center;font-weight:800;max-width:220px;margin:0 auto;display:block}

.seqk{text-align:center;margin:4px 0 0;font-size:1.15rem}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stgrid .btn{min-height:64px;font-size:1.05rem}.stgrid .btn.cur{outline:3px solid var(--sig);outline-offset:2px}

.pad button{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--acc);color:var(--acc-ink)}
.btn.ss{padding:8px 12px;font-size:.88rem}.btn.ss.on{background:var(--news);border-color:var(--sig)}
.hide{letter-spacing:2px;color:var(--muted);font-size:.7em}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.tbl th,.tbl td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl thead th{font-size:.78rem;color:var(--muted);font-weight:700}.tbl tbody tr{cursor:pointer}.tbl .num{text-align:right}.tbl .verl{white-space:normal;font-weight:700}
.tbl .old{color:var(--down);font-weight:700}
.obsl{list-style:none;padding:0;margin:8px 0}.obsl li{display:flex;align-items:center;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.head{display:flex;align-items:center;gap:10px;margin:2px 0 4px}.head .kl{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:60;max-width:min(92vw,520px);min-height:44px;padding:10px 16px;border:0;border-radius:14px;background:var(--sig);color:var(--sig-ink);font:600 1rem/1.3 system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.18)}@media print{.updbar{display:none}}
/* App-Sperre */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px;overflow:auto}

#lock .pins.bad{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Erfassen kompakt (0.4.5): auf dem iPhone alle Knöpfe ohne Scrollen, Menüleiste unten ausgeblendet */

<script>
"use strict";
/* ===== Speicher =====
   Technik-Kern übernommen aus Pfad 1.1.3 (hbg-pfad/pfad, quelle/pfad.html). Liste der Bausteine: docs/technik-aus-pfad.md */
const SOMI_VERSION="0.5.4 Beta",SOMI_STAND="08.11.2026";
const KEY="somi-beta";
const FAECHER=["Mathe","Sport"];
const KURSE={"-":"ohne Kurs","E":"E-Kurs","G":"G-Kurs"};
const PROFILE={r:"Regel",na:"Nachteilsausgleich",zd:"zieldifferent (LE)"};
const FRIST_JAHRE=5; // VO-DV I § 9 Abs. 1: „alle übrigen Daten“, ab Ende des Kalenderjahres der Archivierung

// Mit App-Sperre liegt im Speicher nur ein verschlüsselter Umschlag {somiEnc,salt,iv,ct}; db bleibt bis zum Entsperren leer

  if(db?.somiEnc){ENCWAIT=db;db={...leer(),lock:{salt:ENCWAIT.salt,after:ENCWAIT.after??1,len:ENCWAIT.len||4}}}

function migrate(){if(!db||!Array.isArray(db.sus)||!Array.isArray(db.groups))db=leer();db.del??=[];if(!Array.isArray(db.obs))db.obs=[];if(!Array.isArray(db.att))db.att=[];if(!Array.isArray(db.ka))db.ka=[];if(!Array.isArray(db.asv))db.asv=[];if(!Array.isArray(db.rl))db.rl=[];
  const n=db.sus.length+db.groups.length+db.obs.length+db.att.length+db.ka.length+db.asv.length+db.rl.length;db.sus=db.sus.filter(okSus);db.groups=db.groups.filter(okGroup);db.obs=db.obs.filter(okObs);db.att=db.att.filter(okAtt);db.ka=db.ka.filter(okKa);db.asv=db.asv.filter(okAsv);db.rl=db.rl.filter(okRl);
  if(db.sus.length+db.groups.length+db.obs.length+db.att.length+db.ka.length+db.asv.length+db.rl.length<n)setTimeout(()=>toast("Beschädigte Einträge wurden beiseitegelegt."),600)}
function applyTheme(){const t=db?.theme,r=document.documentElement;if(t==="light"||t==="dark")r.dataset.theme=t;else delete r.dataset.theme;
  if(db?.fs==="l"||db?.fs==="xl")r.dataset.fs=db.fs;else delete r.dataset.fs;
  const dark=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches);document.querySelector('meta[name=theme-color]')?.setAttribute("content",dark?"#14201b":"#f5f6f1")}
let SAVEQ=Promise.resolve(),SAVEN=0;
function save(){if(ENCWAIT)return; // gesperrt und noch nicht entschlüsselt: nichts überschreiben
  if(db.lock&&LKEY){const n=++SAVEN,key=LKEY,json=JSON.stringify(db),meta={somiEnc:1,salt:db.lock.salt,after:db.lock.after,len:db.lock.len};
    SAVEQ=SAVEQ.then(async()=>{const body=await gcm(key,enc(json));if(n===SAVEN)localStorage.setItem(KEY,JSON.stringify({...meta,...body}))}).catch(()=>toast("Speichern nicht möglich. Bitte sichern."))}
  else try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast("Speichern nicht möglich. Bitte sichern.")}}

/* ===== Helfer ===== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Kennungen in onclick immer über ja(): als JS-Text verpackt und für das HTML-Attribut maskiert
const ja=s=>esc(JSON.stringify(String(s??"")));
const dDEy=s=>s?s.slice(8,10)+"."+s.slice(5,7)+"."+s.slice(0,4):"";
const byNum=(a,b)=>a.localeCompare(b,"de",{numeric:true});
// Daten aus Dateien: nur gültige Kennungen und Typen, sonst wird der Eintrag abgelehnt
const okId=s=>typeof s==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(s),okDate=s=>typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const okStr=(s,n=4000)=>s==null||typeof s==="string"&&s.length<=n,okNum=v=>v==null||typeof v==="number"&&isFinite(v);
const okSY=s=>typeof s==="string"&&/^\d{4}\/\d{2}$/.test(s);
function okSus(s){try{return !!s&&okId(s.id)&&typeof s.code==="string"&&s.code.length<=40&&okStr(s.cls,20)&&okStr(s.icon,16)&&Object.hasOwn(PROFILE,s.profil||"r")&&okStr(s.na,2000)&&(s.zdNote==null||typeof s.zdNote==="boolean")&&(s.kl==null||typeof s.kl==="boolean")&&okLez(s.lez)&&okLezAus(s.lezAus)&&okNum(s.upd)}catch(e){return false}}
function okGroup(g){try{return !!g&&okId(g.id)&&FAECHER.includes(g.fach)&&okStr(g.cls,20)&&Object.hasOwn(KURSE,g.kurs||"-")&&okSY(g.sy)&&Array.isArray(g.members)&&g.members.length<=60&&g.members.every(okId)&&(g.arch==null||okDate(g.arch))&&(g.lastK==null||Object.hasOwn(KMAP,g.lastK))&&(g.lastKs==null||Array.isArray(g.lastKs)&&g.lastKs.length<=12&&g.lastKs.every(k=>Object.hasOwn(KMAP,k)))&&(g.lastM==null||Object.hasOwn(AMAP,g.lastM))&&okNum(g.upd)}catch(e){return false}}
const okSetting={theme:t=>["system","light","dark"].includes(t),fs:f=>["m","l","xl"].includes(f),hausa:v=>typeof v==="boolean",werkz:v=>typeof v==="boolean",stw:v=>okStw(v),kgw:v=>okKgw(v),kaTend:v=>typeof v==="boolean",kaw:v=>okKaw(v)};
const susById=id=>db.sus.find(s=>s.id===id);
const groupById=id=>db.groups.find(g=>g.id===id);
const gName=g=>`${g.cls} ${g.fach}${g.kurs&&g.kurs!=="-"?" "+g.kurs:""}`;
const looksLikeName=s=>/^[A-ZÄÖÜ][a-zäöüß]{2,}([ -][A-ZÄÖÜ][a-zäöüß]+)*$/.test(s.trim());
const syNow=()=>{const d=new Date(),y=d.getFullYear()-(d.getMonth()<7?1:0);return `${y}/${String(y+1).slice(2)}`};
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),Math.max(1800,t.length*45))}
let UNDO_T;
function undoToast(msg,fn,ms=8000){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast undo";el.setAttribute("role","status");
  el.innerHTML=`<span class="grow">${esc(msg)}</span><button>Rückgängig</button>`;el.querySelector("button").onclick=()=>{el.remove();clearTimeout(UNDO_T);fn()};document.body.appendChild(el);clearTimeout(UNDO_T);UNDO_T=setTimeout(()=>el.remove(),ms)}
const touch=o=>{o.upd=Date.now();return o};

/* ===== Symbole: neutral, nichts, was auf Hobby, Herkunft, Religion oder Aussehen schließen lässt ===== */
const ICONS=["🦊","🐢","🦉","🐝","🐬","🦋","🐙","🦒","🐧","🦔","🐳","🦜","🐌","🐞","🦁","🐼","🐨","🦓","🦩","🐸","🐠","🦀","🐘","🦭","🐿","🌻","🌵","🍀","🌲","🍄","🌈","⭐","🌙","🚀","⛵","🎈","🪁","🔑","🧭","💎","🍐","🍋","🍉","🫐","🥕","🍒"];
function freeIcon(cls){const used=new Set(db.sus.filter(s=>!cls||s.cls===cls).map(s=>s.icon)),free=ICONS.filter(i=>!used.has(i));const pool=free.length?free:ICONS;return pool[Math.floor(Math.random()*pool.length)]}
const susColor=s=>{let h=0;for(const c of s.id+s.code)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 55% 60%)`};
const susIcon=s=>`<span class="kic" style="--kc:${susColor(s)}" aria-hidden="true">${esc(s.icon||"•")}</span>`;
async function pickIcon(cur,cls){const used=new Set(db.sus.filter(s=>s.cls===cls).map(s=>s.icon));
  return dlg(`<p style="font-weight:700;margin:0 0 4px">Symbol wählen</p><p class="small muted" style="margin:0 0 10px">Bitte zufällig wählen, nicht passend zur Person. Grau = in der Klasse schon vergeben.</p>
  <div class="icgrid">${ICONS.map(i=>`<button data-i="${i}" class="${i===cur?"on":""}${used.has(i)&&i!==cur?" used":""}">${i}</button>`).join("")}</div>
  <div class="duo" style="margin-top:12px"><button class="btn" data-a="0">Abbrechen</button><button class="btn" data-a="r">Zufällig</button></div>`,
  (el,done)=>{el.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>done(b.dataset.i));el.querySelector('[data-a="0"]').onclick=()=>done(null);el.querySelector('[data-a="r"]').onclick=()=>done(freeIcon(cls))})}


/* ===== Sonstige Mitarbeit Mathe (ab 0.2) =====
   Kriterien und Ankertexte nach SILP Mathe 4.2 der Schule. Einträge: db.obs = [{id,gid,sid,k,n,fb,d,t,upd}] */
const NOTEN=["1+","1","1-","2+","2","2-","3+","3","3-","4+","4","4-","5+","5","5-","6"];
const nWert=n=>{const b=+n[0];return n[1]==="+"?b-.3:n[1]==="-"?b+.3:b};
const nTxt=n=>n.replace("-","−");
/* Ab 0.2.4: Beobachtungen in 4 Stufen (o.s), alte Einträge mit Note (o.n) bleiben gültig.
   Umrechnung: jede Stufe hat einen Notenwert (Einstellungen), der Mittelwert wird auf Drittel gerundet → Note mit + und −. */
const STUF={"4":{t:"++",l:"übertroffen"},"3":{t:"+",l:"erfüllt"},"2":{t:"o",l:"teilweise"},"1":{t:"−",l:"kaum erfüllt"}};
const STW0={"4":1,"3":2,"2":3.5,"1":5};
const stw=()=>({...STW0,...(db.stw||{})});
const okKgw=v=>!!v&&typeof v==="object"&&!Array.isArray(v)&&Object.keys(v).every(k=>Object.hasOwn(KMAP,k)&&GWS(kF(KMAP[k])).includes(v[k]));
const okStw=v=>!!v&&typeof v==="object"&&!Array.isArray(v)&&Object.keys(v).every(k=>Object.hasOwn(STUF,k)&&typeof v[k]==="number"&&v[k]>=1&&v[k]<=6);
const oWert=o=>o.s?stw()[o.s]:nWert(o.n);
const oTxt=o=>o.s?STUF[o.s].t:nTxt(o.n);
function noteOf(m){if(m==null)return null;const n=Math.min(6,Math.max(1,Math.ceil(m*3-.5-1e-9)/3)) /* genau in der Mitte: zugunsten der Schüler:innen */,b=Math.round(n),d=n-b;
  if(b>=6)return "6";return d<-.01?b+"+":d>.01?b+"-":String(b)}
const noteTxt=m=>m==null?"–":nTxt(noteOf(m));
const KRIT=[
 {k:"qual",t:"Qualität der Beiträge",kz:"Qualität",hint:"Dazu gehört auch die Fachsprache. Fehler in Erarbeitungs- und Übungsphasen nicht abwerten (Kernlehrplan Mathe). Im Zweifel nicht eintragen.",
  gut:["nennt richtige Lösungen und begründet sie nachvollziehbar","geht selbstständig auf andere Lösungen ein, findet Argumente und Begründungen","stellt Ergebnisse auf unterschiedliche Art und mit verschiedenen Medien dar","verwendet Fachbegriffe sicher und korrekt"],
  aus:["nennt teilweise richtige Lösungen, meist ohne nachvollziehbare Begründung","geht selten auf andere Lösungen ein, nennt Argumente, kann sie aber nicht begründen","stellt Ergebnisse nur auf eine Art dar","verwendet Fachbegriffe selten oder ungenau"]},
 {k:"kont",t:"Beteiligung",kz:"Betei­ligung",hint:"Beteiligung am Unterrichtsgespräch (SILP: Kontinuität). Nur bewerten, wenn du einen klaren Eindruck hast.",
  gut:["beteiligt sich regelmäßig am Unterrichtsgespräch"],aus:["nimmt eher selten am Unterrichtsgespräch teil"]},
 {k:"selbst",t:"Selbstständigkeit",kz:"Selbst­ständig­keit",
  gut:["bringt sich von sich aus ein","ist ausdauernd bei der Sache, erledigt Aufgaben gründlich und zuverlässig","erarbeitet neue Inhalte weitgehend selbstständig, fragt selbst nach","erarbeitet bereitgestellte Materialien selbstständig"],
  aus:["beteiligt sich gelegentlich eigenständig","braucht oft eine Aufforderung zum Arbeitsbeginn, arbeitet Rückstände nur teilweise auf","erarbeitet neue Inhalte mit viel Hilfe, fragt selten nach","erarbeitet bereitgestellte Materialien eher lückenhaft"]},
 {k:"hausa",t:"Hausaufgaben (LZ)",kz:"Haus­aufgaben",opt:"hausa",
  gut:["erledigt LZ-Aufgaben sorgfältig und vollständig","trägt sie mit nachvollziehbaren Erläuterungen vor"],
  aus:["erledigt LZ-Aufgaben weitgehend vollständig, teils oberflächlich","nennt Ergebnisse, erläutert erst auf Nachfrage und oft unvollständig"]},
 {k:"koop",t:"Kooperation",kz:"Koope­ration",hint:"Mehrere Kürzel antippen, dann gilt die Note für die ganze Gruppe.",
  gut:["bringt sich ergebnisorientiert in Gruppen- und Teamarbeit ein","arbeitet kooperativ und respektiert Beiträge anderer"],
  aus:["bringt sich nur wenig in die Gruppen- und Teamarbeit ein","unterstützt die Gruppenarbeit wenig, stört aber nicht"]},
 {k:"fach",t:"Fachsprache",alt:true,gut:["wendet Fachbegriffe sachangemessen an und kann ihre Bedeutung erklären"],aus:["versteht Fachbegriffe nicht immer, wendet sie teils nicht sachangemessen an"]},
 {k:"werk",t:"Werkzeuge",opt:"werkz",gut:["setzt Werkzeuge sicher beim Bearbeiten und Darstellen ein"],aus:["braucht häufig Hilfe beim Einsatz von Werkzeugen"]},
 {k:"praes",t:"Präsentation",pl:"n",gut:["präsentiert vollständig, strukturiert und gut nachvollziehbar"],aus:["präsentiert an mehreren Stellen eher oberflächlich, mit Verständnislücken"]},
 {k:"port",t:"Portfolio, Heft",pl:"n",gut:["führt das Portfolio sorgfältig und vollständig"],aus:["führt das Portfolio weitgehend sorgfältig, aber teils unvollständig"]},
 {k:"sue",t:"Schriftliche Übung",pl:"p",hint:"Etwa 20 Minuten.",gut:["ca. 75 % der Punkte"],aus:["ca. 50 % der Punkte"]},
 /* Sport (ab 0.4.6): die vier Bereiche aus SILP Sport Kap. 3 (Stand 03/2021), Ankertexte angelehnt, Gewicht-Vorschlag 50/10/20/20 */
 {k:"mot",f:"Sport",t:"Motorik",hint:"Kondition, Koordination, Bewegungsqualität, Spielfähigkeit. Der individuelle Fortschritt zählt stark (SILP Sport).",
  gut:["führt Bewegungen sicher, flüssig und genau aus","setzt Kraft, Ausdauer und Schnelligkeit wirksam ein","handelt im Spiel sicher und situationsgerecht","verbessert sich deutlich gegenüber dem Anfang"],
  aus:["führt Bewegungen mit deutlichen Unsicherheiten aus","erfüllt konditionelle Anforderungen nur teilweise","handelt im Spiel selten situationsgerecht","verbessert sich nur wenig"]},
 {k:"kog",f:"Sport",t:"Wissen",hint:"Körper- und sportbezogenes Wissen.",
  gut:["kennt Regeln, Techniken und Fachbegriffe und wendet sie an","beschreibt Bewegungen und erkennt Fehler"],
  aus:["kennt Regeln und Fachbegriffe nur teilweise","beschreibt Bewegungen kaum, erkennt Fehler selten"]},
 {k:"soz",f:"Sport",t:"Sozialverhalten",kz:"Sozial­verhalten",hint:"Kooperation und Hilfsbereitschaft, Konflikte, Regeln. Zählt laut SILP Sport zur Note.",
  gut:["arbeitet mit anderen zusammen, hilft und sichert","löst Konflikte fair","hält Regeln ein"],
  aus:["arbeitet nur wenig mit anderen zusammen","braucht bei Konflikten oft Hilfe","hält Regeln nicht immer ein"]},
 {k:"arb",f:"Sport",t:"Arbeitsverhalten",kz:"Arbeits­verhalten",hint:"Lern-, Leistungs- und Anstrengungsbereitschaft, Zuverlässigkeit, Selbstständigkeit. Zählt laut SILP Sport zur Note.",
  gut:["ist leistungs- und anstrengungsbereit","ist zuverlässig, z. B. beim Auf- und Abbau","übt selbstständig an Aufgaben"],
  aus:["strengt sich nur teilweise an","ist nicht immer zuverlässig","übt nur mit Aufforderung"]},
 /* 0.5.3: Förderplanziel (zieldifferent, LE). Eintrag mit o.z = Ziel-ID, nur in der Runde. */
 {k:"lez",t:"Förderplanziel",alt:true,nogw:true,gut:[],aus:[]},
 /* 0.5.0: punktuelle Überprüfung im Sport (Nicks Wahl 06.11.). Note direkt, zählt im gewählten Bereich (a.b), kein eigenes Gewicht. */
 {k:"pue",f:"Sport",t:"Punktuelle Überprüfung",pl:"n",nogw:true,gut:[],aus:[]}];
const KMAP=Object.fromEntries(KRIT.map(x=>[x.k,x]));
// Ab 0.4.3 (Nicks Wunsch 05.11.): Runde immer mit Qualität, Beteiligung, Selbstständigkeit, Kooperation; Fachsprache entfällt (alte Einträge zählen weiter); Werkzeuge und Hausaufgaben zuschaltbar.
// Kontinuität heißt jetzt „Beteiligung“; Qualität zählt standardmäßig doppelt. Präsentation, Portfolio/Heft und Schriftliche Übung legst du gesondert an (wie Klassenarbeiten).
const optOn=x=>!x.opt||!!db[x.opt];
const kF=x=>x.f||"Mathe",fOf=g=>g&&g.fach==="Sport"?"Sport":"Mathe";
const kritList=(f="Mathe")=>KRIT.filter(x=>kF(x)===f&&!x.alt&&!x.pl&&optOn(x));
const kritGew=(f="Mathe")=>KRIT.filter(x=>kF(x)===f&&!x.alt&&!x.nogw&&optOn(x));
const plk=g=>KRIT.filter(x=>x.pl&&kF(x)===fOf(g));
/* 0.5.3: Förderplanziele für zieldifferent Lernende (LE). s.lez={Mathe:[{id,t}],Sport:[…]}, höchstens 4 je Fach.
   Hat ein LE-Kürzel Ziele, bewertest du in der Runde die Ziele statt der Kriterien; nur sie zählen dann.
   „Note im Zeugnis“ aus: kein Notenvorschlag, stattdessen Textbausteine je Ziel. */
const okLez=v=>v==null||!!v&&typeof v==="object"&&!Array.isArray(v)&&Object.keys(v).every(f=>FAECHER.includes(f)&&Array.isArray(v[f])&&v[f].length<=4&&v[f].every(z=>!!z&&okId(z.id)&&typeof z.t==="string"&&z.t.trim().length>0&&z.t.length<=120));
// 0.5.4 (Nick 08.11.): s.lezAus = Fächer, in denen das LE-Kürzel wie alle anderen bewertet wird (Ziele bleiben gespeichert)
const okLezAus=v=>v==null||Array.isArray(v)&&v.length<=FAECHER.length&&v.every(f=>FAECHER.includes(f));
const lezRoh=(s,f)=>(s&&(s.profil||"r")==="zd"&&s.lez?.[f])||[];
const lezOf=(s,f)=>s?.lezAus?.includes(f)?[]:lezRoh(s,f);
const zdBer=(s,g)=>lezOf(s,fOf(g)).length>0&&!s.zdNote;
const zaehl=(s,g,os)=>{const lz=lezOf(s,fOf(g));if(!lz.length)return os.filter(o=>o.k!=="lez");const ids=new Set(lz.map(z=>z.id));return os.filter(o=>o.k==="lez"&&ids.has(o.z))};
const okey=o=>o.k==="lez"?"z:"+o.z:o.k;
const LEZB=[[3.5,"sicher erreicht"],[2.75,"erreicht"],[1.75,"teilweise erreicht"],[0,"noch nicht erreicht"]];
const lezStand=a=>{const v=a.filter(o=>o.s).map(o=>+o.s);if(!v.length)return null;const m=v.reduce((x,y)=>x+y,0)/v.length;return LEZB.find(([x])=>m>=x)[1]};
const lezSatz=(z,a)=>{const st=lezStand(a);return st?`Ziel „${z.t}“: ${st}.`:null};
const zLab=(o,s)=>o.k==="lez"?`Ziel: ${(s?.lez&&Object.values(s.lez).flat().find(z=>z.id===o.z)?.t)||"gelöscht"}`:KMAP[o.k].t;
// Punktuelle Überprüfungen (Sport): Art, Bereich, Gruppen (Riegen 1 bis 6)
const PUEART=["Demonstration","Motorischer Test","Aufwärmen gestalten","Sportabzeichen","Bundesjugendspiele","Sonstiges"];
const PUEB=["mot","kog","soz","arb"];
const okRg=v=>v==null||!!v&&typeof v==="object"&&!Array.isArray(v)&&Object.keys(v).length<=60&&Object.entries(v).every(([k,n])=>okId(k)&&Number.isInteger(n)&&n>=1&&n<=6);
function okObs(o){try{return !!o&&okId(o.id)&&okId(o.gid)&&okId(o.sid)&&Object.hasOwn(KMAP,o.k)&&(o.k==="lez"?okId(o.z):o.z==null)&&(o.s==null?NOTEN.includes(o.n):Object.hasOwn(STUF,o.s)&&o.n==null)&&(o.fb==null||typeof o.fb==="boolean")&&okDate(o.d)&&okStr(o.t,300)&&okNum(o.upd)}catch(e){return false}}
const obsOf=(gid,sid)=>db.obs.filter(o=>o.gid===gid&&(!sid||o.sid===sid));
/* Sport: Stundenstatus. db.att = [{id,gid,sid,d,st,upd}], höchstens einer pro Gruppe, Kürzel und Tag */
const ST={akt:"aktiv",ohne:"ohne Sportsachen",unf:"sportunfähig",abw:"nicht anwesend"};
function okAtt(a){try{return !!a&&okId(a.id)&&okId(a.gid)&&okId(a.sid)&&Object.hasOwn(ST,a.st)&&okDate(a.d)&&okNum(a.upd)}catch(e){return false}}

/* ===== Klassenarbeiten (ab 0.3) =====
   Gespeichert als db.ka=[{id,gid,t,d,max,sk,r:{sid:{p,st,mx,na,nat}},upd}]. p = Punkte, st = Status ohne Punkte, mx = eigene Höchstpunktzahl (zieldifferent),

const KASCHL={"-":[85,70,55,40,20],"E":[87,73,59,45,18],"G":[87,73,59,45,18]};

/* ===== Massive Unterrichtsstörungen (ab 0.4.3) =====
   Gespeichert in db.asv=[{id,gid,sid,m:"stoer",v:"-",d,t,upd}]. Zählt nicht zur Note (SchulG § 48: Note = Leistung).
   Davor (Beta 0.4.0–0.4.2) lag hier Arbeits- und Sozialverhalten; diese Einträge bleiben lesbar und löschbar, werden aber nicht mehr erfasst. */
const ABER={av:"Arbeitsverhalten",sv:"Sozialverhalten"};
const ASVALT=[{m:"lb",b:"av",t:"leistungsbereit"},{m:"sorg",b:"av",t:"sorgfältig"},{m:"ausd",b:"av",t:"ausdauernd"},{m:"selb",b:"av",t:"selbstständig"},{m:"mat",b:"av",t:"Material dabei"},
  {m:"zus",b:"sv",t:"arbeitet mit anderen"},{m:"reg",b:"sv",t:"hält Regeln ein"},{m:"konf",b:"sv",t:"löst Konflikte"},{m:"hilf",b:"sv",t:"hilft anderen"}];
const STOER="massive Unterrichtsstörung";
const AMAP=Object.fromEntries([...Object.entries(ABER).map(([b,t])=>({m:b,b,t})),...ASVALT,{m:"stoer",b:"st",t:STOER}].map(x=>[x.m,x]));
const AV={"+":{t:"+",l:"gut"},"o":{t:"○",l:"teils"},"-":{t:"−",l:"schwierig"}};
function okAsv(a){try{return !!a&&okId(a.id)&&okId(a.gid)&&okId(a.sid)&&Object.hasOwn(AMAP,a.m)&&Object.hasOwn(AV,a.v)&&(a.m!=="stoer"||a.v==="-")&&okDate(a.d)&&okStr(a.t,300)&&okNum(a.upd)}catch(e){return false}}
const asvOf=(gid,sid,from)=>db.asv.filter(a=>a.gid===gid&&(!sid||a.sid===sid)&&(!from||a.d>=from));
const stOf=(gid,sid,from)=>asvOf(gid,sid,from).filter(a=>a.m==="stoer");
const ovFrom=()=>OVP==="hj"?hjStart():OVP==="sj"?sjStart():"0000-00-00";
const stBtnTxt=on=>`⚠ ${on?"Störung vermerkt (tippen nimmt zurück)":"Massive Unterrichtsstörung"}`;
function asvDel(id){const a=db.asv.find(x=>x.id===id);if(!a)return;db.asv=db.asv.filter(x=>x.id!==id);db.del.push(id);save();render();
  undoToast("Eintrag gelöscht",()=>{db.del=db.del.filter(x=>x!==id);db.asv.push(touch(a));save();render()})}
// Einzeln bewerten: Störung für die ausgewählten Kürzel
function addStoer(){const g=groupById(ER.gid);if(!g||g.arch)return;if(!ER.sel.length)return toast("Tippe zuerst ein Kürzel an.");
  stNote(t=>{const g2=groupById(ER.gid);if(!g2||g2!==g)return;
  const neu=ER.sel.filter(id=>g.members.includes(id)).map(sid=>touch({id:uid(),gid:g.id,sid,m:"stoer",v:"-",d:ER.d||today(),t,...(g.demo?{demo:true}:{})}));
  db.asv.push(...neu);ER.sel=[];save();render();const ids=new Set(neu.map(a=>a.id));
  undoToast("Störung vermerkt",()=>{db.asv=db.asv.filter(a=>!ids.has(a.id));save();render()})})}
// Kürzel-Seite: Störungen dieser Gruppe, darunter alte Verhaltenseinträge (nur noch lesen und löschen)
function stSusCard(s,g){const from=ovFrom(),st=stOf(g.id,s.id,from).sort((x,y)=>y.d.localeCompare(x.d)||y.upd-x.upd),alt=asvOf(g.id,s.id).filter(a=>a.m!=="stoer"),ro=!!g.arch;
  const li=o=>`<li><div class="grow"><span class="small muted">${dDEy(o.d)} · ${esc(AMAP[o.m].t)}</span>${o.m==="stoer"?"":`<br><b>${AV[o.v].t}</b>`}${o.t?`<br><span class="small">${esc(o.t)}</span>`:""}</div>${ro?"":`<button class="btn ghost small danger" aria-label="Eintrag löschen" onclick="asvDel(${ja(o.id)})">✕</button>`}</li>`;
  if(!st.length&&!alt.length)return "";

  <p class="small muted" style="margin:6px 0 0">${OVP==="hj"?"Dieses Halbjahr":OVP==="sj"?"Dieses Schuljahr":"Alle"}: ${hid(String(st.length))} · zählt nicht zur Note</p>
  ${SHOW&&st.length?`<ul class="obsl">${st.map(li).join("")}</ul>`:""}
  ${alt.length&&SHOW?`<details style="margin-top:8px"><summary class="small" style="font-weight:700;cursor:pointer">Ältere Einträge Arbeits- und Sozialverhalten (${alt.length})</summary><p class="small muted">Aus Beta 0.4.0 bis 0.4.2. Werden nicht mehr erfasst. Du kannst sie löschen.</p><ul class="obsl">${alt.map(li).join("")}</ul></details>`:""}</div>`}

/* ===== Rücklauf-Listen (ab 0.4.1) =====
   Gespeichert als db.rl=[{id,gid,t,art,aus,bis,ct,r:{sid:{st,pc}},arch,upd}]. art = RLART, ct = Betrag in Cent (nur Geld),
   st = "ok" (erledigt) oder "teil" (nur Geld, pc = gezahlt in Cent). Kein Eintrag = offen. Keine Erinnerungen an Eltern. */
const RLART={u:"Unterschrift",g:"Geld",f:"Formular"};
const okCt=v=>Number.isInteger(v)&&v>=0&&v<=1e6;
function okRlR(r,ct){return !!r&&typeof r==="object"&&!Array.isArray(r)&&Object.keys(r).length<=60&&Object.entries(r).every(([k,x])=>okId(k)&&!!x&&typeof x==="object"&&!Array.isArray(x)&&(x.st==="ok"&&x.pc==null||x.st==="teil"&&ct!=null&&okCt(x.pc)&&x.pc<ct))}
function okRl(a){try{return !!a&&okId(a.id)&&okId(a.gid)&&typeof a.t==="string"&&a.t.trim().length>0&&a.t.length<=80&&Object.hasOwn(RLART,a.art)&&okDate(a.aus)&&(a.bis==null||okDate(a.bis))
  &&(a.art==="g"?okCt(a.ct)&&a.ct>0:a.ct==null)&&okRlR(a.r,a.ct)&&(a.arch==null||okDate(a.arch))&&okNum(a.upd)}catch(e){return false}}
const eur=c=>(c/100).toFixed(2).replace(".",",")+" €";
const parseEur=t=>{const s=String(t??"").trim().replace(/\s*€$/,"").replace(",",".");if(!/^\d{1,5}(\.\d{1,2})?$/.test(s))return NaN;return Math.round(Number(s)*100)};
const rlById=id=>db.rl.find(a=>a.id===id);
const rlOf=gid=>db.rl.filter(a=>a.gid===gid);
// Stand einer Liste, nur aktuelle Mitglieder der Gruppe
function rlSt(a){const g=groupById(a.gid),ms=g?msOf(g):[],x=s=>a.r[s.id];
  const open=ms.filter(s=>!x(s)),teil=ms.filter(s=>x(s)?.st==="teil"),ok=ms.filter(s=>x(s)?.st==="ok");
  const paid=a.art==="g"?ok.length*a.ct+teil.reduce((n,s)=>n+x(s).pc,0):0;
  return {ms,open,teil,ok,paid,soll:a.art==="g"?ms.length*a.ct:0}}
const rlLate=a=>!a.arch&&a.bis&&a.bis<today()&&rlSt(a).open.length+rlSt(a).teil.length>0;
let RD=null; // Entwurf „Rücklauf-Liste anlegen“
function rlListV(){const g=groupById(view.rl);if(!g){view={tab:view.tab,group:view.rl};return groupV()}

  const card=a=>{const s=rlSt(a),rest=s.open.length+s.teil.length;return `<button class="card tap row" onclick="go({tab:view.tab,group:${ja(g.id)},rl:${ja(g.id)},rld:${ja(a.id)}})"><div class="grow"><div class="code">${esc(a.t)}</div><div class="small${rlLate(a)?" old":" muted"}">${RLART[a.art]}${a.art==="g"?` · ${eur(a.ct)}`:""} · ${a.arch?`abgeschlossen am ${dDEy(a.arch)}`:rest?`noch ${rest} offen`:"alle zurück"}${a.bis&&!a.arch?` · fällig ${dDEy(a.bis)}`:""}</div></div><span aria-hidden="true" class="muted">›</span></button>`};
  return `<button class="btn ghost" onclick="back()">‹ Zurück</button><h1 style="margin-bottom:4px">Rückläufe</h1><p class="muted" style="margin-top:0">${esc(gName(g))} · Elternbriefe, Geld, Unterschriften, Formulare</p>
  ${ro?"":RD?`<div class="card"><b>Neue Rücklauf-Liste</b>
    <label for="rdt">Titel</label><input id="rdt" maxlength="80" value="${esc(RD.t)}" oninput="RD.t=this.value" placeholder="z. B. Elternbrief Wandertag">
    <label>Art</label><div class="pick">${Object.entries(RLART).map(([k,t])=>`<button class="${RD.art===k?"on":""}" aria-pressed="${RD.art===k}" onclick="RD.art='${k}';render()">${t}</button>`).join("")}</div>
    ${RD.art==="g"?`<label for="rdb">Betrag pro Kind in €</label><input id="rdb" inputmode="decimal" maxlength="9" value="${esc(RD.b)}" oninput="RD.b=this.value" placeholder="z. B. 12,50">`:""}
    <div class="two"><div><label for="rda">Ausgegeben am</label><input id="rda" type="date" value="${RD.aus}" onchange="RD.aus=okDate(this.value)?this.value:today()"></div><div><label for="rdf">Fällig bis <span class="muted small">(freiwillig)</span></label><input id="rdf" type="date" value="${RD.bis||""}" onchange="RD.bis=okDate(this.value)?this.value:null"></div></div>
    <div class="duo" style="margin-top:14px"><button class="btn" onclick="RD=null;render()">Abbrechen</button><button class="btn pri" onclick="addRl(${ja(g.id)})">Anlegen</button></div></div>`
  :`<p><button class="btn pri" onclick="RD={t:'',art:'u',b:'',aus:today(),bis:null};render();$('#rdt')?.focus()">+ Rücklauf-Liste</button></p>`}

  <p class="muted small">Die Listen liegen nur auf diesem Gerät. SoMi schickt keine Erinnerungen an Eltern.</p>`}
function addRl(gid){const g=groupById(gid);if(!g||g.arch||!RD)return;const t=RD.t.trim();if(!t)return toast("Bitte einen Titel eintragen.");

  if(RD.bis&&RD.bis<RD.aus)return toast("„Fällig bis“ liegt vor „Ausgegeben am“.");
  const a=touch({id:uid(),gid,t:t.slice(0,80),art:RD.art,aus:RD.aus,bis:RD.bis||null,ct,r:{},arch:null,...(g.demo?{demo:true}:{})});

  ${g.arch?"":`<p class="row" style="flex-wrap:wrap">${a.arch?`<button class="btn" onclick="rlArch(false)">Wieder öffnen</button>`:`<button class="btn" onclick="rlArch(true)">Liste abschließen</button>`}<button class="btn ghost danger" onclick="rlDel()">Löschen</button></p>`}`}

function renderNav(){$("#nav").innerHTML=[["heute","Heute"],["gruppen","Lerngruppen"],["profil","Einstellungen"]].map(([k,t])=>`<button class="${view.tab===k?"on":""}" ${view.tab===k?'aria-current="page"':""} onclick="navTo('${k}')">${ICON[k].replace("<svg ",'<svg aria-hidden="true" ')}${t}</button>`).join("")}
// Verlauf der Ansichten: „Zurück“ führt dorthin, wo man herkam
let HIST=[];const vkey=v=>JSON.stringify([v.tab,v.group,v.sus,v.erf,v.ov,v.ka,!!v.plm,v.kad,!!v.kae,v.names,v.rl,v.rld,!!v.imp,v.kl,v.nkl]);
function go(v){const i=HIST.findIndex(h=>vkey(h)===vkey(v));if(i>=0)HIST.length=i;else if(view&&vkey(view)!==vkey(v))HIST.push(view);view=v;render();window.scrollTo(0,0)}
function back(){view=HIST.pop()||{tab:view.tab};render();window.scrollTo(0,0)}
function navTo(k){HIST=[];go({tab:k})}
function render(){
  renderNav();const a=$("#app");document.body.classList.toggle("erf",!!(view.erf||view.kae&&view.kad));
  if(view.imp)a.innerHTML=importV();
  else if(view.names||view.nkl)a.innerHTML=namesV();
  else if(view.erf)a.innerHTML=erfV();
  else if(view.rld)a.innerHTML=rlV();
  else if(view.rl)a.innerHTML=rlListV();
  else if(view.kad&&view.kae)a.innerHTML=kaeV();
  else if(view.kad)a.innerHTML=kaV();
  else if(view.ka)a.innerHTML=kaListV();
  else if(view.ov)a.innerHTML=ovV();
  else if(view.sus)a.innerHTML=susV();
  else if(view.kl)a.innerHTML=klV();
  else if(view.group)a.innerHTML=groupV();
  else a.innerHTML={heute:heuteV,gruppen:gruppenV,profil:profilV}[view.tab]();
  if(view.mark)requestAnimationFrame(()=>$("#app .mark")?.scrollIntoView({block:"center",behavior:"smooth"}));
}

/* ===== Eigene Dialoge (funktionieren auch dort, wo confirm/prompt blockiert sind) ===== */
function dlg(html,onMount){return new Promise(res=>{const el=document.createElement("div");el.className="cele"+(LOCKED?" lockdlg":"");el.style.zIndex=LOCKED?120:40;
  el.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(el);
  const done=v=>{el.remove();res(v)};el.onclick=e=>{if(e.target===el)done(null)};onMount(el,done)})}
async function ask(msg,o={}){const r=await dlg(`<p style="font-weight:700;font-size:1.05rem;margin:0 0 ${o.sub?6:16}px">${esc(msg)}</p>${o.sub?`<p class="small muted" style="margin:0 0 16px">${esc(o.sub)}</p>`:""}
  <div class="duo"><button class="btn" data-a="0">${esc(o.cancel||"Abbrechen")}</button><button class="btn pri" data-a="1" style="${o.danger?"background:var(--down);border-color:var(--down)":""}">${esc(o.ok||"OK")}</button></div>`,
  (el,done)=>{el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>done(b.dataset.a==="1"));el.querySelector('[data-a="1"]').focus()});return r===true}
async function askText(msg,ph,type){return dlg(`<p style="font-weight:700;margin:0 0 10px">${esc(msg)}</p><input id="dlgIn" type="${type||"text"}" autocomplete="${type==="password"?"current-password":"off"}" placeholder="${esc(ph||"")}">
  <div class="duo" style="margin-top:14px"><button class="btn" data-a="0">Abbrechen</button><button class="btn pri" data-a="1">OK</button></div>`,
  (el,done)=>{const i=el.querySelector("#dlgIn");i.focus();i.onkeydown=e=>{if(e.key==="Enter")done(i.value)};el.querySelector('[data-a="0"]').onclick=()=>done(null);el.querySelector('[data-a="1"]').onclick=()=>done(i.value)})}

/* ===== Gerät: dauerhafter Speicher, Offline, Home-Bildschirm ===== */
const isWeb=/^https?:$/.test(location.protocol),standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
try{navigator.storage?.persist?.()}catch(e){}
if(isWeb&&"serviceWorker" in navigator){const hadSW=!!navigator.serviceWorker.controller;navigator.serviceWorker.register("sw.js").catch(()=>{});
  /* Neue Fassung geladen: nicht von selbst neu laden (sonst gehen halb ausgefüllte Eingaben verloren), sondern Knopf anbieten (wie Pfad 1.2.0) */
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!hadSW||document.querySelector(".updbar"))return;
    const b=document.createElement("button");b.className="updbar";b.type="button";b.textContent="Neue Version von SoMi geladen. Tippe hier zum Aktualisieren.";
    b.addEventListener("click",()=>location.reload());document.body.appendChild(b)})}
function envHint(){if(sessionStorage.getItem("hideEnv"))return "";
  const x=`<button class="btn ghost small" onclick="sessionStorage.setItem('hideEnv',1);render()">Ausblenden</button>`;
  if(!isWeb)return `<div class="card" style="border:2px solid var(--new)"><b>Achtung: Vorschau-Modus</b><p class="small" style="margin:6px 0">Die App läuft gerade als Datei. Dort kann das Gerät die Daten jederzeit löschen. Öffne sie über ihre Internetadresse und speichere regelmäßig eine Sicherung.</p>${x}</div>`;
  if(isIOS&&!standalone)return `<div class="card"><b>Tipp: Als App installieren</b><p class="small" style="margin:6px 0">Tippe in Safari auf „Teilen“ und dann „Zum Home-Bildschirm“. Dann startet SoMi wie eine App, funktioniert offline und Safari löscht die Daten nicht nach einigen Wochen ohne Nutzung. Trag hier im Safari-Tab nichts ein: Das App-Symbol hat einen eigenen Speicher.</p>${x}</div>`;
  return ""}

/* ===== Einrichtung: drei Schritte ===== */
const SETUP=[
 {k:"lock",t:"Code für die App-Sperre festlegen",done:()=>!!db.lock,tip:"Schalte die App-Sperre ein und lege einen Code fest."},
 {k:"demo",t:"Fiktive Beispielklasse laden",done:()=>db.groups.length>0,tip:"Tippe auf „Fiktive Beispielklasse laden“."},
 {k:"backup",t:"Erste Sicherung speichern",done:()=>!!db.lastBackup,tip:"Tippe auf „Sicherung speichern“ und lege ein Passwort fest."}];
const setupOpen=()=>db.setupDone?[]:SETUP.filter(s=>!s.done());
function setupCard(){const open=setupOpen();if(!open.length)return "";const nx=open[0];
  return `<div class="card" style="border:2px solid var(--sig)"><b>Einrichtung: noch ${open.length} von ${SETUP.length} Schritten</b>
  <ul class="chk">${SETUP.map(s=>`<li class="${s.done()?"ok":""}">${s.done()?"✓":"○"} ${s.t}</li>`).join("")}</ul>
  <p class="row" style="margin:0;flex-wrap:wrap"><button class="btn pri" onclick="go({tab:'profil',mark:'${nx.k}'})">${nx.t}</button><span class="grow"></span><button class="btn ghost small" onclick="db.setupDone=1;save();render()">Später</button></p></div>`}
function markFor(k){if(view.tab!=="profil"||!view.mark)return null;
  const s=SETUP.find(x=>x.k===view.mark);
  if(s&&s.done()){const nx=SETUP.find(x=>!x.done());view.mark=nx?nx.k:null;if(!nx){db.setupDone=1;save();setTimeout(()=>toast("Einrichtung fertig"),400)}}
  return view.mark===k?SETUP.find(x=>x.k===k).tip:null}
const mk=k=>markFor(k)?" mark":"";
const mtip=k=>{const t=markFor(k);return t?`<div class="marktip">↓ ${t}</div>`:""};

/* ===== Heute ===== */
const own=()=>db.groups.filter(g=>!g.demo);
function backupHint(){const n=own().length,last=db.lastBackup||0,days=(Date.now()-last)/864e5;
  if(!n||days<3)return ""; // Noten wiegen schwerer: Erinnerung nach 3 Tagen (Pfad: 5)
  return `<div class="card row"><div class="grow small"><b>Sicherung fällig.</b> ${last?`Letzte vor ${Math.floor(days)} Tagen.`:"Noch keine Sicherung."} Ohne Sicherung sind die Daten weg, wenn das Gerät verloren geht, das App-Symbol gelöscht oder der Browserspeicher geleert wird.</div><button class="btn pri" onclick="exportJSON()">Sichern</button></div>`}
// Aufbewahrung: 5 Jahre ab Ende des Kalenderjahres, in dem die Lerngruppe archiviert wurde. Gelöscht wird nur nach Rückfrage.
const keepUntil=g=>`${+g.arch.slice(0,4)+FRIST_JAHRE}-12-31`;
const due=()=>db.groups.filter(g=>g.arch&&!g.demo&&keepUntil(g)<today());
function dueHint(){const d=due();if(!d.length)return "";
  return `<div class="card" style="border:2px solid var(--new)"><b>Aufbewahrungsfrist abgelaufen</b><p class="small" style="margin:6px 0 8px">Diese archivierten Lerngruppen musst du nicht mehr aufbewahren: ${d.map(g=>esc(gName(g))+" ("+esc(g.sy)+")").join(", ")}. Prüfe, ob du sie löschen möchtest. SoMi löscht nichts von selbst.</p>
  <p class="row" style="flex-wrap:wrap;margin:0">${d.map(g=>`<button class="btn" onclick="go({tab:'gruppen',group:${ja(g.id)}})">${esc(gName(g))} ansehen</button>`).join("")}</p></div>`}
function heuteV(){
  const dateLong=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  const act=db.groups.filter(g=>!g.arch).sort((a,b)=>byNum(gName(a),gName(b)));
  let h=`<div class="head">${LOGO}<span class="kl"><b>HBG Köln</b> · SoMi</span></div><p class="muted">${dateLong}</p><h1>Heute</h1>${envHint()}${setupCard()}${backupHint()}${dueHint()}`;
  const rh=rlHint();
  h+=`<div class="stat"><div>Lerngruppen<b>${act.length}</b><span class="muted small">aktiv</span></div><div>Schüler:innen<b>${new Set(act.flatMap(g=>g.members)).size}</b><span class="muted small">in aktiven Gruppen</span></div><div>Archiv<b>${db.groups.filter(g=>g.arch).length}</b><span class="muted small">Gruppen</span></div></div>`;
  if(!act.length)return h+`<div class="card"><p>Noch keine Lerngruppen.</p><p class="muted">Lege unter „Lerngruppen“ eine Gruppe an oder lade unter „Einstellungen“ die fiktive Beispielklasse.</p><p><button class="btn pri" onclick="go({tab:'gruppen',adding:true})">Lerngruppe anlegen</button></p></div>`;
  if(act.length)h+=`<div class="card"><b>Schnell erfassen</b><p class="row" style="flex-wrap:wrap;margin:8px 0 0">${act.map(g=>`<span class="row" style="gap:6px;flex-wrap:wrap">${g.fach==="Mathe"?`<button class="btn pri" onclick="erStart(${ja(g.id)},'k')">${esc(gName(g))}: ganze Klasse</button><button class="btn" onclick="erStart(${ja(g.id)},'e')">Einzeln</button>`:`<button class="btn pri" onclick="erStart(${ja(g.id)},'s')">${esc(gName(g))}: Stundenstatus</button><button class="btn" onclick="erStart(${ja(g.id)},'k')">Bewerten</button>`}</span>`).join("")}</p></div>`;
  h+=rh+`<h2>Deine Lerngruppen</h2>`+act.map(groupCard).join("");
  return h+`<p class="muted small">Version 0.4: Sonstige Mitarbeit, gesonderte Leistungen (Präsentation, Heft, Übung) und Klassenarbeiten in Mathe. Sonstige Leistungen (Motorik, Wissen, Sozial- und Arbeitsverhalten), Stundenstatus und schriftliche Überprüfungen in Sport. Rücklauf-Listen.</p>`}
const groupCard=g=>`<button class="card tap row" onclick="go({tab:'gruppen',group:${ja(g.id)}})"><div class="grow"><div class="code">${esc(gName(g))}${g.demo?' <span class="tag">Beispiel</span>':""}</div><div class="muted small">${esc(g.sy)} · ${g.members.length} Schüler:innen${g.arch?` · archiviert am ${dDEy(g.arch)}`:""}</div></div><span aria-hidden="true" class="muted">›</span></button>`;

/* ===== Lerngruppen ===== */
let GD=null; // Entwurf „Lerngruppe anlegen“
function gruppenV(){
  const act=db.groups.filter(g=>!g.arch).sort((a,b)=>byNum(gName(a),gName(b))),arch=db.groups.filter(g=>g.arch).sort((a,b)=>b.arch.localeCompare(a.arch));
  if(view.adding&&!GD)GD={fach:"Mathe",cls:"",kurs:"-"};
  return `<h1>Lerngruppen</h1>
  ${GD?`<div class="card"><b>Neue Lerngruppe</b>
    <label>Fach</label><div class="pick" style="grid-template-columns:1fr 1fr">${FAECHER.map(f=>`<button class="${GD.fach===f?"on":""}" onclick="GD.fach='${f}';render()">${f}</button>`).join("")}</div>
    <label for="gcls">Klasse</label><div class="sub">Für einen Kurs aus mehreren Klassen z. B. „7“ eintragen. Die Kinder wählst du danach aus den Klassenlisten.</div><input id="gcls" value="${esc(GD.cls)}" placeholder="z. B. 7B" maxlength="20" oninput="GD.cls=this.value">
    <label>Kurs</label><div class="sub">Mathe hat ab Klasse 7 E- und G-Kurse. Danach richtet sich der Notenschlüssel der Klassenarbeiten.</div><div class="pick">${Object.entries(KURSE).map(([k,t])=>`<button class="${GD.kurs===k?"on":""}" onclick="GD.kurs='${k}';render()">${t}</button>`).join("")}</div>
    <div class="duo" style="margin-top:14px"><button class="btn" onclick="GD=null;view.adding=false;render()">Abbrechen</button><button class="btn pri" onclick="addGroup()">Anlegen</button></div></div>`
  :`<p><button class="btn pri" onclick="GD={fach:'Mathe',cls:'',kurs:'-'};render();$('#gcls')?.focus()">+ Lerngruppe</button></p>`}
  ${syCard()}
  ${act.length?act.map(groupCard).join(""):`<p class="muted">Noch keine aktiven Lerngruppen.</p>`}
  ${klSection()}
  ${arch.length?`<details class="card"><summary style="font-weight:800">Archiv (${arch.length})</summary><p class="muted small">Archivierte Gruppen sind nur lesbar. Aufbewahrung ${FRIST_JAHRE} Jahre ab Ende des Kalenderjahres der Archivierung (VO-DV I § 9).</p>${arch.map(groupCard).join("")}</details>`:""}`}
function addGroup(){const cls=GD.cls.trim().toUpperCase();if(!cls)return toast("Bitte die Klasse eintragen, z. B. 7B.");
  if(looksLikeName(GD.cls))return toast("Bitte nur die Klasse eintragen, keinen Namen.");
  if(db.groups.some(g=>!g.arch&&g.cls===cls&&g.fach===GD.fach&&(g.kurs||"-")===GD.kurs))return toast("Diese Lerngruppe gibt es schon.");
  const g=touch({id:uid(),fach:GD.fach,cls,kurs:GD.kurs,sy:syNow(),members:[],arch:null});db.groups.push(g);GD=null;save();go({tab:"gruppen",group:g.id})}
let SD=null; // Entwurf „Schüler:in hinzufügen“
const nextCode=cls=>{let i=1;const taken=new Set(db.sus.map(s=>s.code.toLowerCase()));while(taken.has(`${cls}-${String(i).padStart(2,"0")}`.toLowerCase()))i++;return `${cls}-${String(i).padStart(2,"0")}`};
function namesV(){let ms,title;if(view.nkl){ms=klOf(view.nkl).filter(s=>!s.demo);title="Klasse "+view.nkl}
  else{const g=groupById(view.names);if(!g){view={tab:"gruppen",group:view.names};return groupV()}ms=msOf(g);title=gName(g)}
  const head=`<button class="btn ghost" onclick="back()">‹ Zurück</button><h1 style="margin-bottom:4px">Namen</h1><p class="muted" style="margin-top:0">${esc(title)}</p>`;
  if(!db.lock||!LKEY)return head+`<div class="card"><p>Namen gehen nur mit App-Sperre. So sind sie verschlüsselt und nur nach Eingabe deines Codes sichtbar.</p><p style="margin-bottom:0"><button class="btn pri" onclick="go({tab:'profil'})">Zur App-Sperre</button></p></div>`;
  return head+`<div class="card"><p class="small muted" style="margin-top:0">Die Namen liegen nur auf diesem Gerät, verschlüsselt und getrennt von den Noten. Sie stehen nicht in der normalen Sicherung. Sichere sie unter „Einstellungen“ → „Namensliste sichern“.</p>
  ${ms.map(s=>`<label class="row" style="margin:8px 0;font-weight:600"><span class="code" style="min-width:5.5em">${esc(s.code)}</span><input class="grow" data-sid="${esc(s.id)}" maxlength="60" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(NAMES[s.id]||"")}" placeholder="Name" aria-label="Name zu ${esc(s.code)}"></label>`).join("")}
  <p style="margin-bottom:0"><button class="btn pri block" onclick="saveNamesV()">Namen speichern</button></p></div>`}
function saveNamesV(){if(!db.lock||!LKEY)return;let n=0;
  document.querySelectorAll("#app input[data-sid]").forEach(i=>{const sid=i.dataset.sid,v=i.value.trim().slice(0,60);if(!susById(sid))return;if(v){NAMES[sid]=v;n++}else delete NAMES[sid]});
  saveNames();back();toast(n?`${n} ${n===1?"Name":"Namen"} gespeichert`:"Namen entfernt")}
function groupV(){const g=groupById(view.group);if(!g){view={tab:"gruppen"};return gruppenV()}
  const ms=g.members.map(susById).filter(Boolean).sort((a,b)=>byNum(a.code,b.code)),ro=!!g.arch;
  const others=pickable(g);
  return `<button class="btn ghost" onclick="back()">‹ Zurück</button>
  <h1>${esc(gName(g))}</h1><p class="muted">${esc(g.sy)} · ${KURSE[g.kurs||"-"]} · ${ms.length} Schüler:innen${g.demo?" · fiktives Beispiel":""}</p>
  ${ro?`<div class="card" style="border:2px solid var(--line)"><b>Archiviert am ${dDEy(g.arch)}</b><p class="small" style="margin:6px 0">Aufbewahren bis ${dDEy(keepUntil(g))}. Danach fragt SoMi, ob du die Gruppe löschen möchtest.</p>
    <p class="row" style="flex-wrap:wrap;margin:0"><button class="btn" onclick="unarchive(${ja(g.id)})">Wieder aktivieren</button><button class="btn ghost danger" onclick="delGroup(${ja(g.id)})">Löschen</button></p></div>`:""}
  ${ro?"":SD?`<div class="card"><b>Schüler:in hinzufügen</b>
    <div class="sub" style="margin-top:6px">Nur Kürzel nach dem Muster Klasse-Nummer. Namen trägst du getrennt unter „Namen eintragen“ ein.</div>

    :`<p class="row" style="flex-wrap:wrap"><button class="btn pri" onclick="SD={code:nextCode(${ja(g.cls)})};render();$('#scode')?.focus()">+ Schüler:in</button>${others.length?`<button class="btn" onclick="addExisting(${ja(g.id)})">Aus Klassenlisten wählen</button>`:""}${ms.length?`<button class="btn" onclick="go({tab:view.tab,group:${ja(g.id)},names:${ja(g.id)}})">Namen eintragen</button>`:""}</p>`}
  ${g.fach==="Mathe"?`<p class="row" style="flex-wrap:wrap">${ro?"":`<button class="btn pri" onclick="erStart(${ja(g.id)},'k')">Ganze Klasse nacheinander</button><button class="btn" onclick="erStart(${ja(g.id)},'e')">Einzeln bewerten</button>`}<button class="btn" onclick="go({tab:view.tab,group:${ja(g.id)},ov:${ja(g.id)}})">Übersicht Sonstige Mitarbeit</button><button class="btn" onclick="KD=null;go({tab:view.tab,group:${ja(g.id)},ka:${ja(g.id)},plm:true})">Präsentation, Heft, Übung${plOf(g.id).length?` (${plOf(g.id).length})`:""}</button><button class="btn" onclick="KD=null;go({tab:view.tab,group:${ja(g.id)},ka:${ja(g.id)}})">Klassenarbeiten${kaOf(g.id).length?` (${kaOf(g.id).length})`:""}</button></p>`:`<p class="row" style="flex-wrap:wrap">${ro?"":`<button class="btn pri" onclick="erStart(${ja(g.id)},'s')">Stundenstatus erfassen</button><button class="btn pri" onclick="erStart(${ja(g.id)},'k')">Ganze Klasse bewerten</button><button class="btn" onclick="erStart(${ja(g.id)},'e')">Einzeln bewerten</button>`}<button class="btn" onclick="go({tab:view.tab,group:${ja(g.id)},ov:${ja(g.id)}})">Übersicht Sonstige Leistungen</button><button class="btn" onclick="go({tab:view.tab,group:${ja(g.id)},ov:${ja(g.id)},att:true})">Übersicht Stundenstatus</button><button class="btn" onclick="KD=null;go({tab:view.tab,group:${ja(g.id)},ka:${ja(g.id)},plm:true})">Punktuelle Überprüfungen${plOf(g.id).length?` (${plOf(g.id).length})`:""}</button><button class="btn" onclick="KD=null;go({tab:view.tab,group:${ja(g.id)},ka:${ja(g.id)}})">Schriftliche Überprüfungen${kaOf(g.id).length?` (${kaOf(g.id).length})`:""}</button></p>`}
  ${!ro&&ms.length&&stale(g).length?`<p class="small" style="margin:0 0 10px"><b>Seit 2 Wochen ohne Eintrag:</b> ${stale(g).map(x=>esc(x.code)).join(", ")}</p>`:""}
  <p class="row" style="flex-wrap:wrap"><button class="btn" onclick="RD=null;go({tab:view.tab,group:${ja(g.id)},rl:${ja(g.id)}})">Rückläufe${rlOf(g.id).filter(a=>!a.arch).length?` (${rlOf(g.id).filter(a=>!a.arch).length})`:""}</button></p>
  ${ms.length?ms.map(s=>`<button class="card tap row" onclick="go({tab:'gruppen',group:${ja(g.id)},sus:${ja(s.id)}})">${susIcon(s)}<div class="grow"><div class="code">${esc(s.code)}</div>${nm(s)}${(s.profil||"r")!=="r"?`<span class="tag ${s.profil}">${esc(PROFILE[s.profil])}${s.profil==="zd"?(s.zdNote?" · mit Note":" · Bericht"):""}</span>`:`<span class="muted small">Regel</span>`}</div><span aria-hidden="true" class="muted">›</span></button>`).join(""):`<p class="muted">Noch niemand in dieser Gruppe.</p>`}

function addSus(gid){const g=groupById(gid),code=SD.code.trim();if(!code)return toast("Bitte ein Kürzel eintragen.");

function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function giveFile(name,txt,type="application/json"){const file=new File([txt],name,{type});
  if(matchMedia("(pointer:coarse)").matches&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]});return true}catch(e){if(e.name==="AbortError")return false}}
  download(name,txt,type);return true}

const b64=u=>{let s="";new Uint8Array(u).forEach(c=>s+=String.fromCharCode(c));return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function pwKey(pw,salt){const base=await crypto.subtle.importKey("raw",enc(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function gcm(key,data){const iv=rnd(12);return {iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,data))}}
const ungcm=(key,o)=>crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},key,unb64(o.ct));
async function idb(){return new Promise((ok,no)=>{const r=indexedDB.open("somi-beta",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>ok(r.result);r.onerror=no})}

/* ===== App-Sperre mit Verschlüsselung (aus Pfad; in SoMi Standard an) =====

async function codeKey(code,salt){const base=await crypto.subtle.importKey("raw",enc(code),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(salt),iterations:600000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function tryCode(c){const raw=ENCWAIT||JSON.parse(localStorage.getItem(KEY)||"null");if(!raw?.somiEnc)return null;

  if(a==null)return render();if(!/^\d{4,6}$/.test(a)){render();return toast("Bitte 4 bis 6 Ziffern.")}
  if(await askCode("Code wiederholen")!==a){render();return toast("Die Codes stimmen nicht überein.")}
  const salt=b64(rnd(16));LKEY=await codeKey(a,salt);db.lock={salt,len:a.length,after:db.lock?.after??1};save();saveNames();await SAVEQ;await NSAVEQ;render();toast(change?"Code geändert":"SoMi ist jetzt gesperrt und verschlüsselt")}
async function offLock(){if(!await ask("App-Sperre wirklich ausschalten?",{ok:"Ausschalten",danger:true,sub:"Danach liegen Noten und Beobachtungen unverschlüsselt im Speicher dieses Geräts. Eingetragene Namen werden gelöscht."}))return render();
  const c=await askCode("Zum Ausschalten Code eingeben");
  if(c!=null&&await tryCode(c)){delete db.lock;LKEY=null;dropNames();save();render();toast("App-Sperre ist aus")}else{render();if(c)toast("Code falsch")}}
function lockNow(){if(!db.lock)return;LOCKED=true;LOCKIN="";document.body.classList.add("locked");document.activeElement?.blur?.();renderLock()}
function renderLock(msg,busy){let el=$("#lock");if(!LOCKED){el?.remove();return}
  if(!el){el=document.createElement("div");el.id="lock";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","SoMi ist gesperrt");document.body.appendChild(el)}
  const wait=Math.ceil((LOCKWAIT-Date.now())/1000),len=db.lock.len||4;
  el.innerHTML=`<div class="box"><div style="font-size:2.4rem" aria-hidden="true">🔒</div><h1 style="margin:6px 0 4px">SoMi ist gesperrt</h1>
  <p class="muted" aria-live="polite">${wait>0?`Zu viele Versuche. Warte ${wait} Sekunden.`:busy?"Wird entsperrt …":esc(msg||"Gib deinen Code ein.")}</p>
  <div class="pins${msg?" bad":""}" aria-hidden="true">${[...Array(len)].map((_,i)=>`<i class="${i<LOCKIN.length?"on":""}"></i>`).join("")}</div>
  <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="lockPress('${n}')">${n}</button>`).join("")}<button class="nb" onclick="lockForgot()">Vergessen?</button><button onclick="lockPress('0')">0</button><button class="nb" aria-label="Ziffer löschen" onclick="LOCKIN=LOCKIN.slice(0,-1);renderLock()">⌫</button></div></div>`;
  if(wait>0)setTimeout(()=>LOCKED&&renderLock(),1000)}
let LOCKBUSY=false;
async function lockPress(d){if(LOCKWAIT>Date.now()||LOCKBUSY)return;const len=db.lock.len||4;if(LOCKIN.length>=len)return;LOCKIN+=d;renderLock();if(LOCKIN.length<len)return;
  LOCKBUSY=true;renderLock("",true);const r=await tryCode(LOCKIN);LOCKBUSY=false;LOCKIN="";
  if(r){LOCKFAIL=0;LOCKWAIT=0;saveFail();LKEY=r.key;if(ENCWAIT){ENCWAIT=null;db=r.data;migrate();applyTheme();await loadNames(r.key)}LOCKED=false;document.body.classList.remove("locked");renderLock();render();return}
  LOCKFAIL++;if(LOCKFAIL>=5)LOCKWAIT=Date.now()+30000*2**Math.min(LOCKFAIL-5,10);saveFail();try{navigator.vibrate?.(80)}catch(e){}renderLock("Falscher Code. Versuch es noch einmal.")}
async function lockForgot(){if(!await ask("Code vergessen?",{ok:"Alles löschen",danger:true,sub:"Ohne Code lassen sich die Daten nicht entschlüsseln. Du kannst alles auf diesem Gerät löschen und danach deine letzte Sicherung laden."}))return;
  const keep=ENCWAIT?{}:db;ENCWAIT=null;LKEY=null;
  db={...leer(),theme:keep.theme,fs:keep.fs,bsalt:keep.bsalt,setupDone:keep.setupDone};migrate();
  localStorage.removeItem(KEY);dropNames();save();LOCKED=false;document.body.classList.remove("locked");renderLock();applyTheme();go({tab:"profil"});toast("Alles gelöscht. Lade jetzt deine letzte Sicherung und schalte die Sperre wieder ein.")}
document.addEventListener("visibilitychange",()=>{if(!db?.lock)return;if(document.hidden){HIDDEN_AT=Date.now();if(!db.lock.after)lockNow()}
  else if(!LOCKED&&HIDDEN_AT&&Date.now()-HIDDEN_AT>=db.lock.after*6e4)lockNow()});
document.addEventListener("keydown",e=>{if(!LOCKED||e.target.closest?.(".cele"))return;if(/^\d$/.test(e.key))lockPress(e.key);else if(e.key==="Backspace"){LOCKIN=LOCKIN.slice(0,-1);renderLock()}});

load();applyTheme();matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change",applyTheme);if(db.lock)lockNow();render();
</script>
</body>
